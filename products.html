<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>สินค้า | CHATPHETCH GROUP</title>

  <meta
    name="description"
    content="สินค้าและผลิตภัณฑ์จาก CHATPHETCH GROUP"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #ffffff;
      color: #111827;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1200px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid #e5e7eb;
      background: white;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav {
      min-height: 74px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 20px;
      font-weight: 900;
    }

    .logo small {
      display: block;
      font-size: 10px;
      font-weight: 500;
      color: #6b7280;
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .nav-links a {
      color: #4b5563;
      font-size: 14px;
      font-weight: 700;
    }

    .nav-links a:hover {
      color: #111827;
    }

    .hero {
      background:
        linear-gradient(
          135deg,
          #f8fafc,
          #eef2ff
        );

      padding: 70px 0;
      text-align: center;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 900;
    }

    .hero p {
      max-width: 650px;
      margin: 15px auto 0;
      color: #6b7280;
      line-height: 1.8;
    }

    .filters {
      padding: 30px 0;
    }

    .filter-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-row input,
    .filter-row select {
      padding: 13px 15px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      background: white;
    }

    .filter-row input {
      flex: 1;
      min-width: 240px;
    }

    .products {
      padding: 10px 0 80px;
    }

    .products-grid {
      display: grid;
      grid-template-columns:
        repeat(
          3,
          minmax(0, 1fr)
        );

      gap: 24px;
    }

    .product-card {
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      overflow: hidden;
      background: white;

      transition:
        transform .2s,
        box-shadow .2s;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow:
        0 15px 40px
        rgba(0,0,0,.08);
    }

    .product-image {
      aspect-ratio: 1 / 1;
      background: #f3f4f6;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .no-image {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #9ca3af;
    }

    .product-body {
      padding: 20px;
    }

    .category {
      display: inline-block;

      padding: 6px 10px;

      background: #eff6ff;
      color: #1d4ed8;

      border-radius: 999px;

      font-size: 11px;
      font-weight: 800;

      margin-bottom: 12px;
    }

    .product-name {
      font-size: 19px;
      font-weight: 900;
      line-height: 1.45;
    }

    .product-code {
      margin-top: 6px;
      color: #6b7280;
      font-size: 13px;
    }

    .product-description {
      margin-top: 12px;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.7;

      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .detail-button {
      margin-top: 18px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 100%;

      padding: 12px;

      background: #111827;
      color: white;

      border-radius: 10px;

      font-weight: 800;
      font-size: 14px;
    }

    .loading,
    .empty {
      text-align: center;
      padding: 70px 20px;
      color: #6b7280;
      grid-column: 1 / -1;
    }

    footer {
      border-top: 1px solid #e5e7eb;
      padding: 30px 0;
      color: #6b7280;
      font-size: 13px;
    }

    @media (max-width: 900px) {

      .products-grid {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
      }

      .nav-links {
        display: none;
      }

    }

    @media (max-width: 600px) {

      .container {
        width:
          min(
            100% - 28px,
            1200px
          );
      }

      .products-grid {
        grid-template-columns: 1fr;
      }

      .hero {
        padding: 50px 0;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="container nav">

    <a
      href="index.html"
      class="logo"
    >
      CHATPHETCH GROUP
      <small>
        CONSTRUCTION &amp; MATERIALS
      </small>
    </a>


    <nav class="nav-links">

      <a href="index.html">
        หน้าแรก
      </a>

      <a href="products.html">
        สินค้า
      </a>

      <a href="contact.html">
        ติดต่อเรา
      </a>

    </nav>

  </div>

</header>


<section class="hero">

  <div class="container">

    <h1>
      สินค้า
    </h1>

    <p>
      ผลิตภัณฑ์และวัสดุสำหรับงานก่อสร้าง
      งานพื้น งานเคลือบ และงานที่เกี่ยวข้อง
      จาก CHATPHETCH GROUP
    </p>

  </div>

</section>


<section class="filters">

  <div class="container">

    <div class="filter-row">

      <input
        id="searchInput"
        type="search"
        placeholder="ค้นหาชื่อสินค้า / รหัสสินค้า..."
      >


      <select id="categoryFilter">

        <option value="">
          ทุกหมวดหมู่
        </option>

        <option value="floor">
          พื้น / พิมพ์ลายคอนกรีต
        </option>

        <option value="coating">
          วัสดุเคลือบ / เคลือบผิว
        </option>

        <option value="paint">
          สี
        </option>

        <option value="construction">
          วัสดุก่อสร้าง
        </option>

        <option value="other">
          อื่น ๆ
        </option>

      </select>

    </div>

  </div>

</section>


<section class="products">

  <div class="container">

    <div
      id="productsGrid"
      class="products-grid"
    >

      <div class="loading">
        กำลังโหลดสินค้า...
      </div>

    </div>

  </div>

</section>


<footer>

  <div class="container">

    ©
    <span id="year"></span>
    CHATPHETCH GROUP.
    All Rights Reserved.

  </div>

</footer>


<script>

  const SUPABASE_URL =
    "https://mfhllgklcfnnbyyzzljz.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_rkWSZF3He7_mhCIRY9MaNQ_JGBEa1l5";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  let products = [];


  const CATEGORY_LABELS = {

    floor:
      "พื้น / พิมพ์ลายคอนกรีต",

    coating:
      "วัสดุเคลือบ / เคลือบผิว",

    paint:
      "สี",

    construction:
      "วัสดุก่อสร้าง",

    other:
      "อื่น ๆ"

  };


  document.getElementById(
    "year"
  ).textContent =
    new Date().getFullYear();


  document.getElementById(
    "searchInput"
  ).addEventListener(
    "input",
    renderProducts
  );


  document.getElementById(
    "categoryFilter"
  ).addEventListener(
    "change",
    renderProducts
  );


  async function loadProducts() {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("products")
        .select("*")
        .eq(
          "is_active",
          true
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(error);

      document.getElementById(
        "productsGrid"
      ).innerHTML = `
        <div class="empty">
          ไม่สามารถโหลดข้อมูลสินค้าได้
        </div>
      `;

      return;

    }


    products =
      data || [];


    renderProducts();

  }


  function renderProducts() {

    const search =
      document.getElementById(
        "searchInput"
      ).value
      .trim()
      .toLowerCase();


    const category =
      document.getElementById(
        "categoryFilter"
      ).value;


    const filtered =
      products.filter(product => {

        const matchSearch =
          !search
          ||
          (product.name || "")
            .toLowerCase()
            .includes(search)
          ||
          (product.code || "")
            .toLowerCase()
            .includes(search);


        const matchCategory =
          !category
          ||
          product.category === category;


        return (
          matchSearch
          &&
          matchCategory
        );

      });


    const grid =
      document.getElementById(
        "productsGrid"
      );


    if (!filtered.length) {

      grid.innerHTML = `
        <div class="empty">
          ไม่พบสินค้าที่ค้นหา
        </div>
      `;

      return;

    }


    grid.innerHTML =
      filtered
        .map(product => {

          const image =
            product.image_url
              ? `
                <img
                  src="${escapeAttr(product.image_url)}"
                  alt="${escapeAttr(product.name)}"
                  loading="lazy"
                >
              `
              : `
                <div class="no-image">
                  ไม่มีรูปสินค้า
                </div>
              `;


          return `

            <article class="product-card">

              <div class="product-image">
                ${image}
              </div>

              <div class="product-body">

                <div class="category">
                  ${escapeHtml(
                    CATEGORY_LABELS[
                      product.category
                    ]
                    ||
                    product.category
                    ||
                    "อื่น ๆ"
                  )}
                </div>

                <div class="product-name">
                  ${escapeHtml(
                    product.name
                  )}
                </div>

                <div class="product-code">
                  รหัสสินค้า:
                  ${escapeHtml(
                    product.code || "-"
                  )}
                </div>

                ${
                  product.description
                    ? `
                      <div class="product-description">
                        ${escapeHtml(
                          product.description
                        )}
                      </div>
                    `
                    : ""
                }

                <a
                  class="detail-button"
                  href="product-detail.html?id=${encodeURIComponent(product.id)}"
                >
                  ดูรายละเอียดสินค้า
                </a>

              </div>

            </article>

          `;

        })
        .join("");

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function escapeAttr(value) {

    return escapeHtml(value);

  }


  loadProducts();

</script>

</body>
</html>
