        grid-template-columns:
          1fr

      }

          },

          {
            label: "1 KG",
            price: 388
          }

        ]

      },


      {
        id: "91429",

        category: "coating",

        category_label:
          "สี / น้ำยา",

        image:
          "assets/products/91429.jpg",

        name:
          "READY COAT COLOR (RCR)",

        short_desc:
          "น้ำยาเคลือบเงาคอนกรีต (ชนิดสี)",

        price_label:
          "เริ่ม 369.-",

        numeric_price:
          369,

        details: [

          "(เฉดสีตามลูกค้าต้องการ)",

          "750 มล. : 2-3 ตร.ม. / 2 เที่ยว",

          "4 กก. : 12-15 ตร.ม.",

          "9 กก. : 25-30 ตร.ม.",

          "18 กก. : 40-50 ตร.ม."

        ],

        features: [

          "ป้องกันรังสี UV",

          "เพิ่มความเงางาม",

          "ช่วยป้องกันคราบสกปรก"

        ],

        options: [

          {
            label: "1 KG",
            price: 369
          },

          {
            label: "4 KG",
            price: 1059
          },

          {
            label: "9 KG",
            price: 2175
          },

          {
            label: "18 KG",
            price: 3850
          }

        ]

      }

    ];


    /* =====================================================
       STATE
    ===================================================== */

    let products =
      DEFAULT_PRODUCTS.map(
        normalizeProduct
      );


    let currentCategory =
      "all";


    /* =====================================================
       IMAGE MAP
    ===================================================== */

    const PRODUCT_IMAGES = {

      "91428":
        "assets/products/91428.jpg",

      "91427":
        "assets/products/releaser-power.jpg",

      "91430":
        "assets/products/91430.jpg",

      "91429":
        "assets/products/91429.jpg"

    };


    /* =====================================================
       SORT ORDER
    ===================================================== */

    const PRODUCT_ORDER = [

      "91428",

      "91427",

      "91430",

      "91429"

    ];


    /* =====================================================
       ESCAPE HTML
    ===================================================== */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       NORMALIZE PRODUCT
    ===================================================== */

    const CATEGORY_LABELS = {

      floor:
        "วัสดุงานพื้น",

      coating:
        "สี / น้ำยา",

      paint:
        "สี",

      construction:
        "วัสดุก่อสร้าง",

      other:
        "อื่น ๆ"

    };


    function formatProductPrice(
      value
    ) {

      const number =
        Number(value || 0);

      if (!number) {
        return "";
      }

      return (
        number.toLocaleString("th-TH")
        + ".-"
      );

    }


    function normalizeProduct(
      product
    ) {

      const raw =
        product || {};

      const category =
        raw.category || "other";

      const numericPrice =
        Number(
          raw.numeric_price
          ??
          raw.numericPrice
          ??
          raw.price
          ??
          0
        );

      const features =
        Array.isArray(raw.features)
          ? raw.features
          : Array.isArray(raw.highlights)
            ? raw.highlights
            : [];

      const technical =
        raw.technical_data &&
        typeof raw.technical_data === "object"
          ? raw.technical_data
          : {};

      const details =
        Array.isArray(raw.details)
          ? raw.details
          : [

              raw.technical_grade
                ? `เกรด : ${raw.technical_grade}`
                : "",

              raw.technical_quantity
                ? `ปริมาณ : ${raw.technical_quantity}`
                : "",

              raw.technical_coverage
                ? `พื้นที่ใช้งาน : ${raw.technical_coverage}`
                : "",

              raw.package_size
                ? `ขนาดบรรจุ : ${raw.package_size}`
                : "",

              technical.grade
                ? `เกรด : ${technical.grade}`
                : "",

              technical.quantity
                ? `ปริมาณ : ${technical.quantity}`
                : "",

              technical.coverage
                ? `พื้นที่ใช้งาน : ${technical.coverage}`
                : ""

            ].filter(Boolean);


      return {

        ...raw,

        id:
          String(
            raw.id
            ??
            raw.code
            ??
            ""
          ),

        code:
          raw.code
          ||
          raw.id
          ||
          "",

        category,

        category_label:
          raw.category_label
          ||
          raw.categoryLabel
          ||
          CATEGORY_LABELS[category]
          ||
          "สินค้า",

        image:
          raw.image
          ||
          raw.image_url
          ||
          "",

        name:
          raw.name
          ||
          "",

        short_desc:
          raw.short_desc
          ||
          raw.shortDesc
          ||
          raw.short_description
          ||
          raw.description
          ||
          "",

        price_label:
          raw.price_label
          ||
          raw.priceLabel
          ||
          (
            numericPrice
              ? formatProductPrice(
                  numericPrice
                )
              : ""
          ),

        numeric_price:
          numericPrice,

        details,

        features,

        options:
          Array.isArray(
            raw.options
          )
            ? raw.options
            : []

      };

    }


    /* =====================================================
       PRODUCT IMAGE
    ===================================================== */

    function getProductImage(
      product
    ) {

      const id =
        String(
          product?.id ?? ""
        );


      if (
        product?.image &&
        String(
          product.image
        ).trim() !== ""
      ) {

        return String(
          product.image
        ).trim();

      }


      return (
        PRODUCT_IMAGES[id]
        ||
        ""
      );

    }


    /* =====================================================
       SORT PRODUCTS
    ===================================================== */

    function sortProducts(
      list
    ) {

      return list.sort(
        (
          first,
          second
        ) => {

          const firstIndex =
            PRODUCT_ORDER.indexOf(
              String(first.id)
            );


          const secondIndex =
            PRODUCT_ORDER.indexOf(
              String(second.id)
            );


          if (
            firstIndex !== -1 &&
            secondIndex !== -1
          ) {

            return (
              firstIndex -
              secondIndex
            );

          }


          if (
            firstIndex !== -1
          ) {

            return -1;

          }


          if (
            secondIndex !== -1
          ) {

            return 1;

          }


          return String(
            first.name
          ).localeCompare(
            String(second.name)
          );

        }
      );

    }


    /* =====================================================
       LOAD PRODUCTS
    ===================================================== */

    async function loadProducts() {

      /*
       * แสดงข้อมูลเดิมก่อน
       * เพื่อไม่ให้หน้าเว็บว่าง
       * หาก Supabase โหลดไม่ได้
       */

      products =
        sortProducts(
          DEFAULT_PRODUCTS.map(
            normalizeProduct
          )
        );

      renderProducts();


      if (!supabaseClient) {
        return;
      }


      try {

        const result =
          await supabaseClient
            .from("products")
            .select("*")
            .eq(
              "is_active",
              true
            );


        if (result.error) {

          console.warn(
            "Supabase product load failed:",
            result.error
          );

          return;

        }


        if (
          Array.isArray(result.data)
          &&
          result.data.length > 0
        ) {

          const remoteProducts =
            result.data
              .map(
                normalizeProduct
              )
              .map(
                product => {

                  if (
                    !product.image
                  ) {

                    product.image =
                      PRODUCT_IMAGES[
                        String(
                          product.id
                        )
                      ]
                      ||
                      "";

                  }

                  return product;

                }
              );


          products =
            sortProducts(
              remoteProducts
            );

          renderProducts();

        }

      }
      catch (error) {

        console.warn(
          "Supabase product load failed:",
          error
        );

      }

    }


    /* =====================================================
       IMAGE ERROR
    ===================================================== */

    function handleImageError(
      imageElement,
      productId
    ) {

      const fallback =
        PRODUCT_IMAGES[
          String(productId)
        ];


      if (
        fallback
        &&
        imageElement.dataset.fallbackApplied !== "1"
      ) {

        imageElement.dataset.fallbackApplied =
          "1";

        imageElement.src =
          fallback;

        return;

      }


      imageElement.style.display =
        "none";


      const parent =
        imageElement.closest(
          ".product-image-link"
        );


      if (
        parent
        &&
        !parent.querySelector(
          ".image-error"
        )
      ) {

        const message =
          document.createElement(
            "div"
          );


        message.className =
          "image-error";


        message.textContent =
          "ไม่พบรูปสินค้า";


        message.style.cssText = `
          position:absolute;
          inset:0;
          display:grid;
          place-items:center;
          color:rgba(255,255,255,.55);
          font-size:12px;
        `;


        parent.appendChild(
          message
        );

      }

    }


    /* =====================================================
       RENDER PRODUCTS
    ===================================================== */

    function renderProducts() {

      const grid =
        document.getElementById(
          "productGrid"
        );


      if (!grid) {
        return;
      }


      const filtered =
        currentCategory === "all"

          ? products

          : products.filter(
              product =>
                String(
                  product.category
                )
                ===
                String(
                  currentCategory
                )
            );


      if (
        filtered.length === 0
      ) {

        grid.innerHTML = `

          <div class="empty">

            ยังไม่มีสินค้าในหมวดนี้

          </div>

        `;

        return;

      }


      grid.innerHTML =
        filtered
          .map(
            product =>
              createProductCard(
                product
              )
          )
          .join("");

    }


    /* =====================================================
       CREATE PRODUCT CARD
    ===================================================== */

    function createProductCard(
      product
    ) {

      const id =
        encodeURIComponent(
          String(
            product.id
          )
        );


      const productImage =
        getProductImage(
          product
        );


      const safeName =
        escapeHtml(
          product.name
        );


      const safeCategory =
        escapeHtml(
          product.category_label
        );


      const safeDescription =
        escapeHtml(
          product.short_desc
        );


      const safePrice =
        escapeHtml(
          product.price_label
        );


      const imageHtml =
        productImage

          ? `

            <img
              class="product-image"
              src="${escapeHtml(productImage)}"
              alt="${safeName}"
              loading="eager"
              onerror="handleImageError(this, '${escapeHtml(String(product.id))}')"
            >

          `

          : `

            <div
              style="
                width:100%;
                height:100%;
                display:grid;
                place-items:center;
                color:rgba(255,255,255,.50);
                font-size:12px;
              "
            >
              ไม่พบรูปสินค้า
            </div>

          `;


      return `

        <article class="product-card">


          <a
            class="product-image-link"
            href="product-detail.html?id=${id}"
            aria-label="ดูรายละเอียด ${safeName}"
          >

            ${imageHtml}


            <span class="image-overlay">
              คลิกดูรายละเอียด →
            </span>

          </a>


          <div class="product-content">


            <div class="product-category">
              ${safeCategory}
            </div>


            <h2 class="product-name">

              <a
                href="product-detail.html?id=${id}"
              >
                ${safeName}
              </a>

            </h2>


            <div class="product-description">
              ${safeDescription}
            </div>


            <div class="product-price">
              ${safePrice}
            </div>


            <div class="shipping">
              ✓ ส่งแล้ววันนี้ทั่วไทย
            </div>


            <div class="product-actions">


              <a
                class="detail-button"
                href="product-detail.html?id=${id}"
              >
                ดูรายละเอียด
              </a>


              <button
                type="button"
                class="add-button"
                onclick="quickAdd('${escapeHtml(String(product.id))}')"
              >
                เพิ่มลงตะกร้า
              </button>


            </div>


          </div>


        </article>

      `;

    }


    /* =====================================================
       CART
    ===================================================== */

    function getCart() {

      try {

        const stored =
          localStorage.getItem(
            "chatpetch_cart"
          );


        if (!stored) {
          return [];
        }


        const parsed =
          JSON.parse(
            stored
          );


        return Array.isArray(
          parsed
        )
          ? parsed
          : [];

      }
      catch (error) {

        return [];

      }

    }


    function saveCart(
      cart
    ) {

      try {

        localStorage.setItem(
          "chatpetch_cart",
          JSON.stringify(
            cart
          )
        );


        window.dispatchEvent(
          new Event(
            "cartUpdated"
          )
        );

      }
      catch (error) {

        console.warn(
          "Could not save cart:",
          error
        );

      }

    }


    /* =====================================================
       ADD TO CART
    ===================================================== */

    function quickAdd(
      productId
    ) {

      const product =
        products.find(
          item =>
            String(
              item.id
            )
            ===
            String(
              productId
            )
        );


      if (!product) {
        return;
      }


      /*
       * สินค้าที่มีตัวเลือก
       * ให้ไปหน้า Detail ก่อน
       */

      if (
        Array.isArray(
          product.options
        )
        &&
        product.options.length > 0
      ) {

        window.location.href =
          "product-detail.html?id="
          +
          encodeURIComponent(
            product.id
          );

        return;

      }


      const cart =
        getCart();


      const existing =
        cart.find(
          item =>
            String(
              item.id
            )
            ===
            String(
              product.id
            )
        );


      if (existing) {

        existing.quantity =
          Number(
            existing.quantity || 0
          )
          + 1;

      }
      else {

        cart.push({

          id:
            String(
              product.id
            ),

          productId:
            String(
              product.id
            ),

          name:
            product.name,

          image:
            getProductImage(
              product
            ),

          category:
            product.category,

          categoryLabel:
            product.category_label,

          quantity:
            1,

          priceLabel:
            product.price_label,

          numericPrice:
            product.numeric_price,

          selectedOption:
            null

        });

      }


      saveCart(
        cart
      );


      showToast();

    }


    /* =====================================================
       TOAST
    ===================================================== */

    function showToast() {

      let toast =
        document.getElementById(
          "productToast"
        );


      if (!toast) {

        toast =
          document.createElement(
            "div"
          );


        toast.id =
          "productToast";


        toast.style.cssText = `

          position:fixed;

          z-index:99999;

          left:50%;

          bottom:28px;

          transform:
            translate(-50%,20px);

          padding:
            12px 18px;

          border:
            1px solid
            rgba(228,201,121,.45);

          border-radius:
            999px;

          color:
            #17100a;

          background:
            #e4c979;

          box-shadow:
            0 15px 40px
            rgba(0,0,0,.35);

          font-size:
            13px;

          opacity:
            0;

          transition:
            .25s ease;

        `;


        document.body.appendChild(
          toast
        );

      }


      toast.textContent =
        "เพิ่มสินค้าลงตะกร้าแล้ว";


      requestAnimationFrame(
        () => {

          toast.style.opacity =
            "1";

          toast.style.transform =
            "translate(-50%,0)";

        }
      );


      clearTimeout(
        window.__productToastTimer
      );


      window.__productToastTimer =
        setTimeout(
          () => {

            toast.style.opacity =
              "0";

            toast.style.transform =
              "translate(-50%,20px)";

          },
          2200
        );

    }


    /* =====================================================
       FILTER
    ===================================================== */

    function setupFilters() {

      const buttons =
        document.querySelectorAll(
          ".filter-button"
        );


      buttons.forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              buttons.forEach(
                item =>
                  item.classList.remove(
                    "active"
                  )
              );


              button.classList.add(
                "active"
              );


              currentCategory =
                button.dataset.category
                ||
                "all";


              renderProducts();

            }
          );

        }
      );

    }


    /* =====================================================
       URL CATEGORY
    ===================================================== */

    function readUrlCategory() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const category =
        params.get(
          "category"
        );


      const validCategories = [

        "floor",

        "coating",

        "construction",

        "other"

      ];


      if (
        !validCategories.includes(
          category
        )
      ) {

        return;

      }


      currentCategory =
        category;


      document
        .querySelectorAll(
          ".filter-button"
        )
        .forEach(
          button => {

            button.classList.toggle(
              "active",
              button.dataset.category
                ===
                category
            );

          }
        );

    }


    /* =====================================================
       INIT
    ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        setupFilters();

        readUrlCategory();

        loadProducts();

      }
    );

  </script>


  <!-- =====================================================

  <script
    src="assets/customer-master-nav.js"
  ></script>
