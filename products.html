      --gold-soft:
        rgba(228,201,121,.72);

      --cream:
        #f4ecdf;

      --text:
        #f5eee5;

      --muted:
        rgba(245,238,229,.72);

      --line:
        rgba(201,168,90,.26);

      --panel:
        rgba(10,7,5,.86);

    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing:border-box;

    html {

      scroll-behavior:smooth;

      background:#100b07;

    }

      margin:0;

      min-height:100vh;

      overflow-x:hidden;

      color:var(--text);

      font-family:
        "Prompt",
        "Kanit",
        sans-serif;

      background:#100b07;

    }


    a {

      color:inherit;

      text-decoration:none;

    }


    button {

      font:inherit;

    }


    img {

      max-width:100%;

    }

       FIXED BACKGROUND

    ===================================================== */

    .chatpetch-fixed-background {

      position:fixed;

      inset:0;

      width:100vw;

      height:100vh;

      z-index:0;

      pointer-events:none;

      background:

        linear-gradient(
          180deg,
          rgba(0,0,0,.42) 0%,
          rgba(0,0,0,.34) 24%,
          rgba(0,0,0,.58) 58%,

        translate3d(0,0,0);

      -webkit-transform:

      will-change:
        transform;

    }

       PAGE
    ===================================================== */

    .products-page {

      z-index:1;

      width:100%;

      display:block;

      visibility:visible;

      opacity:1;

    }


    /* =====================================================
       CONTAINER
    ===================================================== */

    .container {

        );

      padding:
        30px
        40px
        35px
        0;

        radial-gradient(
          ellipse at left center,
          rgba(0,0,0,.78),
          rgba(0,0,0,.38) 48%,
          transparent 80%

    .eyebrow {

      color:

      font-size:11px;

      letter-spacing:2.5px;

      font-weight:500;

    }

      margin:

      color:#fff;

      font-family:

        "Prompt",

      color:#fff;

      font-family:
        "Kanit",
        "Prompt",
        sans-serif;

      font-size:

      font-weight:400;

      line-height:1.1;

      max-width:500px;

      margin:0;

      color:var(--muted);

      font-size:13px;

      line-height:1.8;

      text-align:right;

       FILTER
    ===================================================== */

    .filter-panel {

      padding:
        18px
        20px;

      margin-bottom:22px;

      border:
        1px solid
        var(--line);

      background:
        rgba(8,5,3,.82);

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);

    }


    .filter-label {

      margin-bottom:11px;

      color:
        var(--gold-light);

      font-size:10px;

      letter-spacing:1.5px;

    }


    .filter-row {

      display:flex;

      flex-wrap:wrap;

      gap:8px;

    }


    .filter-button {

      min-height:38px;

      padding:
        0
        16px;

      border:
        1px solid
        rgba(201,168,90,.28);

      border-radius:999px;

      color:#f5eee5;

      background:
        rgba(255,255,255,.035);

      cursor:pointer;

      transition:.2s ease;

    }

    .filter-button.active {

      color:#17100a;

      background:
        var(--gold-light);

      border-color:
        var(--gold-light);

    }


    /* =====================================================
       PRODUCT GRID
    ===================================================== */

    .product-grid {

      display:grid;

      grid-template-columns:
        repeat(
          4,
          minmax(0,1fr)
        );

      gap:18px;

      align-items:stretch;

    }


    /* =====================================================
       PRODUCT CARD
    ===================================================== */

    .product-card {

      min-width:0;

      height:100%;

      display:flex;

      flex-direction:column;

      overflow:hidden;

      border:

        var(--line);

      background:
        linear-gradient(
          145deg,
          rgba(17,11,7,.94),
          rgba(5,4,3,.96)
        );

      box-shadow:
        0 18px 45px
        rgba(0,0,0,.18);

      transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;

    }


    .product-card:hover {

      transform:
        translateY(-3px);

      border-color:
        rgba(228,201,121,.48);

      box-shadow:
        0 22px 55px
        rgba(0,0,0,.30);

    }

       PRODUCT IMAGE
    ===================================================== */

    .product-image-link {

      position:relative;

      display:block;

      width:100%;

      height:270px;

      overflow:hidden;

      background:

    }


    .product-image {

      width:100%;

      height:100%;

      object-fit:contain;

      padding:
        22px;

      transition:
        transform .35s ease;

    }


    .product-card:hover

      transform:
        scale(1.035);

    }


    .image-overlay {

      position:absolute;

      left:50%;

      bottom:14px;

      transform:
        translateX(-50%);

      width:max-content;

      max-width:calc(100% - 28px);

      padding:

        11px;

      border:

        rgba(228,201,121,.28);

      color:

      background:
        rgba(0,0,0,.72);

      font-size:10px;

      opacity:0;

      transition:
        opacity .25s ease;

    }


    .product-card:hover

      opacity:1;

    }

      display:flex;

      flex-direction:column;

      font-size:10px;

      letter-spacing:1.6px;

      font-weight:400;

      line-height:1.75;

      font-size:10px;

    }

      display:grid;

      grid-template-columns:
        1fr
        1fr;

      gap:8px;

      margin-top:auto;

      padding-top:16px;

    }


    .detail-button,
    .add-button {

      min-height:39px;

      display:flex;

      align-items:center;

      justify-content:center;

      border:
        1px solid
        rgba(201,168,90,.30);

      font-size:11px;

      cursor:pointer;

      transition:.2s ease;

    .detail-button {

      color:

      background:

    }


    .add-button {

      color:#17100a;

      background:
        var(--gold-light);

      border-color:
        var(--gold-light);

    }


    .detail-button:hover {

      border-color:
        var(--gold-light);

      color:

    }


    .add-button:hover {

      background:
        #f0d990;

    }

       EMPTY / LOADING
    ===================================================== */

    .products-state {

      min-height:260px;

      display:grid;

      place-items:center;

      border:
        1px solid
        var(--line);

      background:
        rgba(5,4,3,.76);

      color:
        var(--muted);

      font-size:14px;

    /* =====================================================

    @media (max-width:1100px) {

      }


      .product-image {

        padding:

          36px;

          15px;

      }


      .filter-button {

        min-height:

        padding:

          13px;

        font-size:
          12px;

      }


      .product-grid {

        grid-template-columns:
          repeat(

      }


      .product-card {

      .product-image {

        padding:
          20px
          12px;

      .image-overlay {

        display:none;

      .product-content {

        padding:
          13px
          11px;

      }


      .product-name {

        font-size:
          17px;

          12px;

      .product-actions {

        grid-template-columns:

        gap:
          6px;

        padding-top:
          12px;

      }


      .detail-button,
      .add-button {

        min-height:
          37px;

      }

        height:
          175px;

      }

    }


    /* =====================================================
       SUPABASE / FALLBACK
    ===================================================== */

    .hidden {

      display:none !important;

    }

  </style>

</head>

        details: [

          "ครอบคลุมพื้นที่ตามอัตราการใช้งาน"

    /* =====================================================
       PRODUCT IMAGE FALLBACK
    ===================================================== */

    const PRODUCT_IMAGES = {

      "91428":
        "assets/products/91428.jpg",

      "91427":
        "assets/products/releaser-power.jpg",

      "91430":
        "assets/products/91430.jpg",

      "91429":
        "assets/products/91429.jpg"

    };


    /* =====================================================
       PRODUCT ORDER
    ===================================================== */

    const PRODUCT_ORDER = [

      "91428",

      "91427",

      "91430",

      "91429"

    ];


    /* =====================================================
       STATE
    ===================================================== */

    let products =
      [];


    let currentCategory =
      "all";


    /* =====================================================
       CATEGORY LABEL
    ===================================================== */

    const PRODUCT_CATEGORY_LABELS = {

      floor:
        "วัสดุงานพื้น",

      coating:
        "สี / น้ำยา",

      construction:
        "วัสดุก่อสร้าง",

      equipment:
        "อุปกรณ์"

    };


    /* =====================================================
       HELPERS
    ===================================================== */

    function escapeHtml(
      value
    ) {

      return String(
        value == null
          ? ""
          : value
      )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

    }


    function getProductImage(
      product
    ) {

      return (
        product.image_url
        ||
        product.image
        ||
        product.cover_image
        ||
        PRODUCT_IMAGES[
          String(
            product.id
          )
        ]
        ||
        ""
      );

    }


    function normalizeCategory(
      product
    ) {

      const value =
        String(
          product.category
          ||
          product.category_key
          ||
          ""
        )
        .trim()
        .toLowerCase();


      if (
        PRODUCT_CATEGORY_LABELS[value]
      ) {

        return value;

      }


      const label =
        String(
          product.category_label
          ||
          ""
        );


      if (
        label.includes(
          "พื้น"
        )
      ) {

        return "floor";

      }


      if (
        label.includes(
          "สี"
        )
        ||
        label.includes(
          "น้ำยา"
        )
      ) {

        return "coating";

      }


      if (
        label.includes(
          "ก่อสร้าง"
        )
      ) {

        return "construction";

      }


      if (
        label.includes(
          "อุปกรณ์"
        )
      ) {

        return "equipment";

      }


      return value || "floor";

    }


    function normalizeProduct(
      product
    ) {

      const category =
        normalizeCategory(
          product
        );


      const numericPrice =
        Number(
          product.numeric_price
          ??
          product.numericPrice
          ??
          product.price
          ??
          0
        );


      const priceLabel =
        product.price_label
        ||
        product.priceLabel
        ||
        (
          numericPrice
            ? `เริ่มต้น ${numericPrice.toLocaleString("th-TH")} บาท`
            : "สอบถามราคา"
        );


      return {

        ...product,

        id:
          String(
            product.id
          ),

        category,

        category_label:
          product.category_label
          ||
          PRODUCT_CATEGORY_LABELS[
            category
          ]
          ||
          category,

        image_url:
          product.image_url
          ||
          product.image
          ||
          product.cover_image
          ||
          PRODUCT_IMAGES[
            String(
              product.id
            )
          ]
          ||
          "",

        name:
          product.name
          ||
          "สินค้า",

        short_desc:
          product.short_desc
          ||
          product.short_description
          ||
          product.description
          ||
          "",

        price_label:
          priceLabel,

        numeric_price:
          numericPrice,

        options:
          Array.isArray(
            product.options
          )
            ? product.options
            : [],

        hidden:
          product.hidden === true

      };

    }


    /* =====================================================
       LOAD PRODUCTS
    ===================================================== */

    async function loadProducts() {

      const grid =
        document.getElementById(
          "productGrid"
        );


      try {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("products")
            .select("*")
            .eq(
              "hidden",
              false
            );


        if (
          error
        ) {

          console.warn(
            "Supabase products error:",
            error
          );


          products =
            DEFAULT_PRODUCTS.map(
              normalizeProduct
            );

        }
        else {

          const remote =
            Array.isArray(
              data
            )
              ? data
                .filter(
                  item =>
                    item.hidden !== true
                )
                .map(
                  normalizeProduct
                )
              : [];


          products =
            remote.length
              ? remote
              : DEFAULT_PRODUCTS.map(
                  normalizeProduct
                );

        }


        /*
         * เรียงสินค้าตามลำดับเดิม
         */

        products.sort(
          (
            a,
            b
          ) => {

            const ai =
              PRODUCT_ORDER.indexOf(
                String(a.id)
              );

            const bi =
              PRODUCT_ORDER.indexOf(
                String(b.id)
              );


            if (
              ai === -1 &&
              bi === -1
            ) {

              return 0;

            }


            if (
              ai === -1
            ) {

              return 1;

            }


            if (
              bi === -1
            ) {

              return -1;

            }


            return ai - bi;

          }
        );


        renderProducts();

      }
      catch (error) {

        console.error(
          error
        );


        products =
          DEFAULT_PRODUCTS.map(
            normalizeProduct
          );


        renderProducts();

      }

    }


    /* =====================================================
       RENDER
    ===================================================== */

    function renderProducts() {

      const grid =
        document.getElementById(
          "productGrid"
        );


      if (!grid) {

        return;

      }


      const filtered =
        currentCategory === "all"

          ? products

          : products.filter(
              product =>
                product.category ===
                currentCategory
            );


      if (
        !filtered.length
      ) {

        grid.innerHTML = `

          <div
            class="products-state"
            style="
              grid-column:1/-1;
            "
          >
            ไม่พบสินค้าในหมวดนี้
          </div>

        `;

        return;

      }


      grid.innerHTML =
        filtered
          .map(
            product =>
              createProductCard(
                product
              )
          )
          .join("");

    }


    /* =====================================================
       CREATE PRODUCT CARD
    ===================================================== */

    function createProductCard(
      product
    ) {

      const id =
        encodeURIComponent(
          String(
            product.id
          )
        );


      const productImage =
        getProductImage(
          product
        );


      const safeName =
        escapeHtml(
          product.name
        );


      const safeCategory =
        escapeHtml(
          product.category_label
        );


      const safeDescription =
        escapeHtml(
          product.short_desc
        );


      const safePrice =
        escapeHtml(
          product.price_label
        );


      const imageHtml =
        productImage

          ? `

            <img
              class="product-image"
              src="${escapeHtml(productImage)}"
              alt="${safeName}"
              loading="eager"
              onerror="handleImageError(this, '${escapeHtml(String(product.id))}')"
            >

          `

          : `

            <div
              style="
                width:100%;
                height:100%;
                display:grid;
                place-items:center;
                color:rgba(255,255,255,.50);
                font-size:12px;
              "
            >
              ไม่พบรูปสินค้า
            </div>

          `;


      return `

        <article class="product-card">


          <a
            class="product-image-link"
            href="product-detail.html?id=${id}"
            aria-label="ดูรายละเอียด ${safeName}"
          >

            ${imageHtml}


            <span class="image-overlay">
              คลิกดูรายละเอียด →
            </span>

          </a>


          <div class="product-content">


            <div class="product-category">
              ${safeCategory}
            </div>


            <h2 class="product-name">

              <a
                href="product-detail.html?id=${id}"
              >
                ${safeName}
              </a>

            </h2>


            <div class="product-description">
              ${safeDescription}
            </div>


            <div class="product-price">
              ${safePrice}
            </div>


            <div class="shipping">
              ✓ ส่งแล้ววันนี้ทั่วไทย
            </div>


            <div class="product-actions">


              <a
                class="detail-button"
                href="product-detail.html?id=${id}"
              >
                ดูรายละเอียด
              </a>


              <button
                type="button"
                class="add-button"
                onclick="quickAdd('${escapeHtml(String(product.id))}')"
              >
                เพิ่มลงตะกร้า
              </button>


            </div>


          </div>


        </article>

      `;

    }


    /* =====================================================
       IMAGE ERROR
    ===================================================== */

    function handleImageError(
      image,
      productId
    ) {

      const fallback =
        PRODUCT_IMAGES[
          String(
            productId
          )
        ];


      if (
        fallback
        &&
        image.src.indexOf(
          fallback
        ) === -1
      ) {

        image.src =
          fallback;

        return;

      }


      image.style.display =
        "none";

    }


    /* =====================================================
       CART
    ===================================================== */

    function getCart() {

      try {

        const stored =
          localStorage.getItem(
            "chatpetch_cart"
          );


        if (!stored) {

          return [];

        }


        const parsed =
          JSON.parse(
            stored
          );


        return Array.isArray(
          parsed
        )
          ? parsed
          : [];

      }
      catch (error) {

        return [];

      }

    }


    function saveCart(
      cart
    ) {

      try {

        localStorage.setItem(
          "chatpetch_cart",
          JSON.stringify(
            cart
          )
        );


        window.dispatchEvent(
          new Event(
            "cartUpdated"
          )
        );

      }
      catch (error) {

        console.warn(
          "Could not save cart:",
          error
        );

      }

    }


    /* =====================================================
       ADD TO CART
    ===================================================== */

    function quickAdd(
      productId
    ) {

      const product =
        products.find(
          item =>
            String(
              item.id
            ) ===
            String(
              productId
            )
        );


      if (!product) {

        return;

      }


      /*
       * สินค้าที่มีตัวเลือก
       * ให้ไปหน้า Detail ก่อน
       */

      if (
        Array.isArray(
          product.options
        )
        &&
        product.options.length > 0
      ) {

        window.location.href =
          "product-detail.html?id="
          +
          encodeURIComponent(
            product.id
          );

        return;

      }


      const cart =
        getCart();


      const existing =
        cart.find(
          item =>
            String(
              item.id
            ) ===
            String(
              product.id
            )
        );


      if (existing) {

        existing.quantity =
          Number(
            existing.quantity || 0
          ) + 1;

      }
      else {

        cart.push({

          id:
            String(
              product.id
            ),

          productId:
            String(
              product.id
            ),

          name:
            product.name,

          image:
            getProductImage(
              product
            ),

          category:
            product.category,

          categoryLabel:
            product.category_label,

          quantity:
            1,

          priceLabel:
            product.price_label,

          numericPrice:
            product.numeric_price,

          selectedOption:
            null

        });

      }


      saveCart(
        cart
      );


      showToast();

    }


    /* =====================================================
       TOAST
    ===================================================== */

    function showToast() {

      let toast =
        document.getElementById(
          "productToast"
        );


      if (!toast) {

        toast =
          document.createElement(
            "div"
          );


        toast.id =
          "productToast";


        toast.style.cssText = `

          position:fixed;

          z-index:99999;

          left:50%;

          bottom:28px;

          transform:
            translate(-50%,20px);

          padding:
            12px 18px;

          border:
            1px solid
            rgba(228,201,121,.45);

          border-radius:
            999px;

          color:
            #17100a;

          background:
            #e4c979;

          box-shadow:
            0 15px 40px
            rgba(0,0,0,.35);

          font-size:
            13px;

          opacity:
            0;

          transition:
            .25s ease;

        `;


        document.body.appendChild(
          toast
        );

      }


      toast.textContent =
        "เพิ่มสินค้าลงตะกร้าแล้ว";


      requestAnimationFrame(
        () => {

          toast.style.opacity =
            "1";

          toast.style.transform =
            "translate(-50%,0)";

        }
      );


      clearTimeout(
        window.__productToastTimer
      );


      window.__productToastTimer =
        setTimeout(
          () => {

            toast.style.opacity =
              "0";

            toast.style.transform =
              "translate(-50%,20px)";

          },
          2200
        );

    }


    /* =====================================================
       FILTER
    ===================================================== */

    function setupFilters() {

      const buttons =
        document.querySelectorAll(
          ".filter-button"
        );


      buttons.forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              buttons.forEach(
                item =>
                  item.classList.remove(
                    "active"
                  )
              );


              button.classList.add(
                "active"
              );


              currentCategory =
                button.dataset.category
                ||
                "all";


              renderProducts();

            }
          );

        }
      );

    }


    /* =====================================================
       URL CATEGORY
    ===================================================== */

    function readUrlCategory() {

      const params =
        new URLSearchParams(
          window.location.search
        );


      const category =
        params.get(
          "category"
        );


      const validCategories = [

        "floor",

        "coating",

        "construction",

        "equipment"

      ];


      if (
        !validCategories.includes(
          category
        )
      ) {

        return;

      }


      currentCategory =
        category;


      document
        .querySelectorAll(
          ".filter-button"
        )
        .forEach(
          button => {

            button.classList.toggle(
              "active",
              button.dataset.category ===
                category
            );

          }
        );

    }


    /* =====================================================
       INIT
    ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        setupFilters();

        readUrlCategory();

        loadProducts();

      }
    );

  </script>
