<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>รายละเอียดสินค้า | CHATPHETCH GROUP</title>

  <meta
    name="description"
    content="รายละเอียดผลิตภัณฑ์ CHATPHETCH GROUP"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #111827;
      background: #ffffff;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width:
        min(
          1180px,
          calc(100% - 40px)
        );

      margin: 0 auto;
    }

    header {
      border-bottom:
        1px solid #e5e7eb;

      background: white;
    }

    .nav {
      min-height: 74px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 20px;
      font-weight: 900;
    }

    .logo small {
      display: block;

      font-size: 10px;
      color: #6b7280;

      letter-spacing: 1px;
    }

    .back {
      color: #4b5563;
      font-weight: 700;
      font-size: 14px;
    }

    .breadcrumb {
      padding: 25px 0;

      color: #6b7280;
      font-size: 13px;
    }

    .product-main {
      padding:
        10px 0 80px;
    }

    .product-layout {
      display: grid;

      grid-template-columns:
        minmax(0, 0.9fr)
        minmax(0, 1.1fr);

      gap: 60px;

      align-items: start;
    }

    .product-image {
      position: sticky;
      top: 20px;

      border-radius: 20px;
      overflow: hidden;

      background: #f3f4f6;

      aspect-ratio: 1 / 1;
    }

    .product-image img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .no-image {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #9ca3af;
    }

    .category {
      display: inline-block;

      background: #eff6ff;
      color: #1d4ed8;

      padding:
        7px 11px;

      border-radius: 999px;

      font-size: 12px;
      font-weight: 800;

      margin-bottom: 15px;
    }

    h1 {
      margin: 0;

      font-size:
        clamp(
          30px,
          5vw,
          48px
        );

      line-height: 1.2;
    }

    .code {
      margin-top: 10px;

      color: #6b7280;

      font-size: 14px;
    }

    .description {
      margin-top: 25px;

      color: #4b5563;

      line-height: 1.9;

      white-space: pre-line;
    }

    .section {
      margin-top: 40px;
    }

    .section-title {
      margin: 0 0 18px;

      font-size: 22px;
      font-weight: 900;
    }

    .highlights {
      list-style: none;
      padding: 0;
      margin: 0;

      display: grid;
      gap: 11px;
    }

    .highlights li {
      position: relative;

      padding-left: 28px;

      line-height: 1.7;

      color: #374151;
    }

    .highlights li::before {
      content: "✓";

      position: absolute;
      left: 0;
      top: 1px;

      width: 20px;
      height: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #111827;
      color: white;

      font-size: 11px;
      font-weight: 900;
    }

    .technical-table {
      width: 100%;
      border-collapse: collapse;
    }

    .technical-table tr {
      border-bottom:
        1px solid #e5e7eb;
    }

    .technical-table td {
      padding:
        14px 0;

      vertical-align: top;

      line-height: 1.7;
    }

    .technical-table td:first-child {
      width: 38%;

      color: #6b7280;

      font-weight: 700;
    }

    .technical-table td:last-child {
      font-weight: 700;
    }

    .usage-box {
      background: #f8fafc;

      border-radius: 16px;

      padding: 22px;

      line-height: 1.8;

      color: #374151;
    }

    .package-box {
      margin-top: 20px;

      padding: 22px;

      border-radius: 16px;

      background: #111827;
      color: white;
    }

    .package-box .label {
      font-size: 12px;
      opacity: .7;
      margin-bottom: 6px;
    }

    .package-box .value {
      font-size: 18px;
      font-weight: 900;
    }

    .pdf-button {
      display: inline-flex;

      margin-top: 30px;

      padding:
        13px 18px;

      border-radius: 10px;

      background: #111827;
      color: white;

      font-weight: 800;
    }

    .loading,
    .error {
      padding: 100px 20px;
      text-align: center;
      color: #6b7280;
    }

    footer {
      border-top:
        1px solid #e5e7eb;

      padding:
        30px 0;

      color: #6b7280;

      font-size: 13px;
    }

    @media (max-width: 850px) {

      .product-layout {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .product-image {
        position: static;
      }

    }

    @media (max-width: 600px) {

      .container {
        width:
          min(
            100% - 28px,
            1180px
          );
      }

      .technical-table td:first-child {
        width: 42%;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="container nav">

    <a
      href="products.html"
      class="logo"
    >
      CHATPHETCH GROUP

      <small>
        CONSTRUCTION &amp; MATERIALS
      </small>
    </a>

    <a
      href="products.html"
      class="back"
    >
      ← กลับไปหน้าสินค้า
    </a>

  </div>

</header>


<div class="container">

  <div class="breadcrumb">

    สินค้า
    /
    <span id="breadcrumbName">
      รายละเอียดสินค้า
    </span>

  </div>

</div>


<main class="product-main">

  <div class="container">

    <div
      id="content"
      class="loading"
    >
      กำลังโหลดข้อมูลสินค้า...
    </div>

  </div>

</main>


<footer>

  <div class="container">

    ©
    <span id="year"></span>
    CHATPHETCH GROUP.
    All Rights Reserved.

  </div>

</footer>


<script>

  const SUPABASE_URL =
    "https://mfhllgklcfnnbyyzzljz.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_rkWSZF3He7_mhCIRY9MaNQ_JGBEa1l5";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  const CATEGORY_LABELS = {

    floor:
      "พื้น / พิมพ์ลายคอนกรีต",

    coating:
      "วัสดุเคลือบ / เคลือบผิว",

    paint:
      "สี",

    construction:
      "วัสดุก่อสร้าง",

    other:
      "อื่น ๆ"

  };


  document.getElementById(
    "year"
  ).textContent =
    new Date().getFullYear();


  async function loadProduct() {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const id =
      params.get("id");


    if (!id) {

      showError(
        "ไม่พบรหัสสินค้า"
      );

      return;

    }


    const {
      data: product,
      error
    } =
      await supabaseClient
        .from("products")
        .select("*")
        .eq(
          "id",
          id
        )
        .eq(
          "is_active",
          true
        )
        .maybeSingle();


    if (error) {

      console.error(error);

      showError(
        "ไม่สามารถโหลดข้อมูลสินค้าได้"
      );

      return;

    }


    if (!product) {

      showError(
        "ไม่พบสินค้านี้ หรือสินค้านี้ถูกซ่อนอยู่"
      );

      return;

    }


    renderProduct(product);

  }


  function renderProduct(product) {

    document.title =
      `${product.name} | CHATPHETCH GROUP`;


    document.getElementById(
      "breadcrumbName"
    ).textContent =
      product.name;


    const image =
      product.image_url
        ? `
          <img
            src="${escapeAttr(product.image_url)}"
            alt="${escapeAttr(product.name)}"
          >
        `
        : `
          <div class="no-image">
            ไม่มีรูปสินค้า
          </div>
        `;


    const highlights =
      Array.isArray(
        product.highlights
      )
      ? product.highlights
      : [];


    const highlightsHtml =
      highlights.length
        ? `

          <section class="section">

            <h2 class="section-title">
              จุดเด่นผลิตภัณฑ์
            </h2>

            <ul class="highlights">

              ${
                highlights
                  .map(
                    item => `
                      <li>
                        ${escapeHtml(item)}
                      </li>
                    `
                  )
                  .join("")
              }

            </ul>

          </section>

        `
        : "";


    const technicalRows = [];


    if (
      product.technical_grade
    ) {

      technicalRows.push(`

        <tr>

          <td>
            เกรด
          </td>

          <td>
            ${escapeHtml(
              product.technical_grade
            )}
          </td>

        </tr>

      `);

    }


    if (
      product.technical_quantity
    ) {

      technicalRows.push(`

        <tr>

          <td>
            ปริมาณ
          </td>

          <td>
            ${escapeHtml(
              product.technical_quantity
            )}
          </td>

        </tr>

      `);

    }


    if (
      product.technical_coverage
    ) {

      technicalRows.push(`

        <tr>

          <td>
            พื้นที่ใช้งาน
          </td>

          <td>
            ${escapeHtml(
              product.technical_coverage
            )}
          </td>

        </tr>

      `);

    }


    if (
      product.package_size
    ) {

      technicalRows.push(`

        <tr>

          <td>
            ขนาดบรรจุ
          </td>

          <td>
            ${escapeHtml(
              product.package_size
            )}
          </td>

        </tr>

      `);

    }


    const technicalHtml =
      technicalRows.length
        ? `

          <section class="section">

            <h2 class="section-title">
              ข้อมูลทางเทคนิค
            </h2>

            <table class="technical-table">

              <tbody>

                ${
                  technicalRows.join("")
                }

              </tbody>

            </table>

          </section>

        `
        : "";


    const usageHtml =
      product.usage
        ? `

          <section class="section">

            <h2 class="section-title">
              การใช้งาน
            </h2>

            <div class="usage-box">
              ${escapeHtml(
                product.usage
              )}
            </div>

          </section>

        `
        : "";


    const packageHtml =
      product.package_summary
        ? `

          <section class="section">

            <h2 class="section-title">
              ขนาดบรรจุ / พื้นที่ใช้งาน
            </h2>

            <div class="package-box">

              <div class="label">
                ข้อมูลผลิตภัณฑ์
              </div>

              <div class="value">
                ${escapeHtml(
                  product.package_summary
                )}
              </div>

            </div>

          </section>

        `
        : "";


    const pdfHtml =
      product.spec_pdf_url
        ? `

          <a
            href="${escapeAttr(product.spec_pdf_url)}"
            target="_blank"
            rel="noopener"
            class="pdf-button"
          >
            ดูเอกสาร PDF
          </a>

        `
        : "";


    document.getElementById(
      "content"
    ).className =
      "";


    document.getElementById(
      "content"
    ).innerHTML = `

      <div class="product-layout">


        <div class="product-image">

          ${image}

        </div>


        <div>


          <div class="category">

            ${escapeHtml(
              CATEGORY_LABELS[
                product.category
              ]
              ||
              product.category
              ||
              "อื่น ๆ"
            )}

          </div>


          <h1>
            ${escapeHtml(
              product.name
            )}
          </h1>


          <div class="code">

            รหัสสินค้า:
            ${escapeHtml(
              product.code || "-"
            )}

          </div>


          ${
            product.description
              ? `

                <div class="description">
                  ${escapeHtml(
                    product.description
                  )}
                </div>

              `
              : ""
          }


          ${highlightsHtml}


          ${technicalHtml}


          ${usageHtml}


          ${packageHtml}


          ${pdfHtml}


        </div>

      </div>

    `;

  }


  function showError(message) {

    document.getElementById(
      "content"
    ).className =
      "error";


    document.getElementById(
      "content"
    ).innerHTML = `
      ${escapeHtml(message)}

      <br><br>

      <a
        href="products.html"
        style="
          display:inline-block;
          padding:12px 16px;
          background:#111827;
          color:white;
          border-radius:9px;
          font-weight:700;
        "
      >
        กลับไปหน้าสินค้า
      </a>
    `;

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function escapeAttr(value) {

    return escapeHtml(value);

  }


  loadProduct();

</script>

</body>
</html>
