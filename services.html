<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>บริการ | CHATPHETCH GROUP</title>
<meta name="description" content="บริการหลักของ CHATPHETCH GROUP ทั้ง 6 ระบบ พร้อมตัวอย่างผลงานจริง">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --black:#030303;
  --gold:#c9a45c;
  --gold2:#ead18d;
  --white:#fff;
  --muted:#999;
  --line:rgba(255,255,255,.10);
  --goldline:rgba(201,164,92,.34);
  --max:1380px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:#030303;
  color:#fff;
  font-family:Prompt,Kanit,sans-serif;
  overflow-x:hidden;
}
a{text-decoration:none;color:inherit}
body:before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-10;
  pointer-events:none;
  background:
    radial-gradient(circle at 82% 5%,rgba(201,164,92,.13),transparent 30%),
    linear-gradient(180deg,#080605,#020202 72%);
}
body:after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-9;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:70px 70px;
  mask-image:linear-gradient(to bottom,black,transparent 85%);
}
.container{
  width:min(var(--max),calc(100% - 80px));
  margin:auto;
}
.page{
  padding-top:92px;
}
.hero{
  position:relative;
  padding:78px 0 48px;
  overflow:hidden;
}
.hero:after{
  content:"SERVICES";
  position:absolute;
  right:-20px;
  bottom:-40px;
  font-family:Kanit,sans-serif;
  font-size:150px;
  line-height:1;
  font-weight:700;
  color:rgba(255,255,255,.018);
  pointer-events:none;
}
.kicker{
  display:flex;
  align-items:center;
  gap:12px;
  color:var(--gold2);
  font-size:12px;
  letter-spacing:3px;
  margin-bottom:15px;
}
.kicker:before{
  content:"";
  width:48px;height:1px;
  background:var(--gold);
}
.hero h1{
  font-family:Kanit,sans-serif;
  font-size:clamp(48px,6vw,78px);
  line-height:1.05;
  font-weight:500;
  margin-bottom:16px;
}
.hero h1 span{color:var(--gold2)}
.hero p{
  max-width:850px;
  color:#a49d94;
  font-size:14px;
  line-height:1.9;
}
.services{
  padding:12px 0 110px;
}
.service-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:20px;
}
.service-card{
  position:relative;
  min-width:0;
  height:405px;
  overflow:hidden;
  border:1px solid var(--goldline);
  border-radius:15px;
  background:#090705;
  isolation:isolate;
  transition:.3s ease;
}
.service-card:hover{
  transform:translateY(-5px);
  border-color:rgba(234,209,141,.72);
  box-shadow:0 28px 70px rgba(0,0,0,.55);
}
.service-card img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .65s ease,filter .65s ease;
}
.service-card:before{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  background:linear-gradient(180deg,rgba(0,0,0,.03) 18%,rgba(0,0,0,.18) 42%,rgba(0,0,0,.95) 100%);
}
.service-card:hover img{
  transform:scale(1.05);
  filter:brightness(1.06);
}
.card-number{
  position:absolute;
  z-index:3;
  top:17px;
  right:18px;
  color:var(--gold2);
  font-size:10px;
  letter-spacing:2px;
}
.card-content{
  position:absolute;
  z-index:3;
  left:22px;
  right:22px;
  bottom:20px;
}
.card-label{
  color:var(--gold2);
  font-size:9px;
  letter-spacing:2px;
  margin-bottom:6px;
}
.card-content h2{
  font-family:Kanit,sans-serif;
  font-size:27px;
  line-height:1.18;
  font-weight:500;
  margin-bottom:8px;
}
.card-content p{
  color:#c1bbb3;
  font-size:11px;
  line-height:1.7;
  margin-bottom:15px;
  max-width:94%;
}
.card-foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.detail-link{
  color:#fff;
  font-size:11px;
  border-bottom:1px solid var(--gold);
  padding-bottom:3px;
}
.round-arrow{
  width:42px;height:42px;
  display:grid;
  place-items:center;
  border:1px solid var(--gold);
  border-radius:50%;
  color:var(--gold2);
  font-size:20px;
  transition:.3s;
}
.service-card:hover .round-arrow{
  background:var(--gold);
  color:#050403;
  transform:translateX(3px);
}
.loading,
.error{
  grid-column:1/-1;
  min-height:280px;
  display:grid;
  place-items:center;
  border:1px solid var(--line);
  color:#888;
  font-size:12px;
  text-align:center;
}
.error{
  padding:30px;
  line-height:1.9;
}
@media(max-width:1100px){
  .container{width:min(var(--max),calc(100% - 40px))}
  .service-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:700px){
  .container{width:calc(100% - 28px)}
  .page{padding-top:78px}
  .hero{padding:58px 0 35px}
  .hero h1{font-size:43px}
  .hero p{font-size:12px}
  .hero:after{font-size:80px;bottom:-15px}
  .services{padding-top:6px}
  .service-grid{grid-template-columns:1fr;gap:15px}
  .service-card{height:315px}
  .card-content{left:17px;right:17px;bottom:16px}
  .card-content h2{font-size:23px}
}
</style>
</head>

<body>

<div class="page">

<section class="hero">
  <div class="container">
    <div class="kicker">OUR SERVICES</div>
    <h1>บริการ<span>ของเรา</span></h1>
    <p>
      6 บริการหลักของ CHATPHETCH GROUP โดยใช้ชื่อและลิงก์ชุดเดียวกัน
      ตั้งแต่เมนูบริการ การ์ดบริการ ไปจนถึงหน้า Service Detail
    </p>
  </div>
</section>

<section class="services">
  <div class="container">
    <div class="service-grid" id="serviceGrid">
      <div class="loading">กำลังโหลดภาพผลงานจริง...</div>
    </div>
  </div>
</section>

</div>

<script src="assets/customer-master-nav.js"></script>

<script>
"use strict";

const TREE_API =
  "https://api.github.com/repos/chatphetch/chatpetch-group/git/trees/main?recursive=1";

const RAW_BASE =
  "https://raw.githubusercontent.com/chatphetch/chatpetch-group/main/";

const CACHE_KEY = "chatpetch_projects_tree_v3";
const CACHE_TIME_KEY = "chatpetch_projects_tree_v3_time";
const CACHE_MAX_AGE = 30 * 60 * 1000;

const SERVICES = [
  {
    key:"industrial",
    num:"01",
    title:"พื้นอุตสาหกรรม / อีพ็อกซี่ / พียู",
    label:"INDUSTRIAL FLOORING",
    desc:"ระบบพื้นสำหรับโรงงาน คลังสินค้า และพื้นที่ใช้งานหนัก",
    folders:["Epoxy anti static","Epoxy self","PU Coating","PU Self"]
  },
  {
    key:"waterproof",
    num:"02",
    title:"งานกันรั่วซึม ดาดฟ้า หลังคา พื้นอาคาร",
    label:"WATERPROOFING",
    desc:"ระบบกันรั่วซึมสำหรับดาดฟ้า หลังคา และพื้นที่อาคาร",
    folders:["งานกันซึม Fiberglass"]
  },
  {
    key:"concrete",
    num:"03",
    title:"งานซ่อมปรับปรุง งานคอนกรีต",
    label:"CONCRETE REPAIR",
    desc:"งานซ่อม ปรับปรุง และฟื้นฟูพื้นคอนกรีต",
    folders:["งาน Polishing"]
  },
  {
    key:"sports",
    num:"04",
    title:"พื้นสนามกีฬา",
    label:"SPORT FLOORING",
    desc:"ระบบพื้นสำหรับสนามกีฬาและพื้นที่กิจกรรม",
    folders:["PU Self"]
  },
  {
    key:"decorative",
    num:"05",
    title:"พื้นตกแต่งเพื่อความสวยงาม",
    label:"DECORATIVE FLOOR",
    desc:"งานพื้นพิมพ์ลายและงานตกแต่งเพื่อภาพลักษณ์พื้นที่",
    folders:["งาน Stamped Concrete"]
  },
  {
    key:"traffic",
    num:"06",
    title:"ระบบงานสัญลักษณ์และเส้นจราจร",
    label:"TRAFFIC MARKING",
    desc:"งานตีเส้นและสัญลักษณ์สำหรับพื้นที่ใช้งาน",
    folders:["PU Coating"]
  }
];

const grid = document.getElementById("serviceGrid");

function imageFile(path){
  return /\.(jpg|jpeg|png|webp|gif)$/i.test(path || "");
}

function escapeHtml(value){
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

async function getTree(){

  const cached = sessionStorage.getItem(CACHE_KEY);
  const cachedTime = Number(sessionStorage.getItem(CACHE_TIME_KEY) || 0);

  if(cached && Date.now() - cachedTime < CACHE_MAX_AGE){
    try{
      return JSON.parse(cached);
    }catch(e){}
  }

  const response = await fetch(TREE_API,{
    headers:{Accept:"application/vnd.github+json"},
    cache:"no-store"
  });

  if(!response.ok){
    throw new Error("GitHub Tree API " + response.status);
  }

  const data = await response.json();

  if(data.truncated){
    throw new Error("GitHub repository tree is truncated");
  }

  sessionStorage.setItem(CACHE_KEY,JSON.stringify(data.tree || []));
  sessionStorage.setItem(CACHE_TIME_KEY,String(Date.now()));

  return data.tree || [];
}

function folderImages(tree,folder){

  const prefix = "assets/Projects/" + folder + "/";

  return tree
    .filter(item =>
      item.type === "blob" &&
      item.path.startsWith(prefix) &&
      imageFile(item.path)
    )
    .sort((a,b)=>a.path.localeCompare(b.path,undefined,{numeric:true}))
    .map(item =>
      RAW_BASE +
      item.path.split("/").map(encodeURIComponent).join("/")
    );
}

function findFirstImage(tree,folders){

  for(const folder of folders){
    const images = folderImages(tree,folder);
    if(images.length) return images[0];
  }

  return "";
}

function render(tree){

  grid.innerHTML = SERVICES.map(service => {

    const image = findFirstImage(tree,service.folders);

    return `
      <a
        class="service-card"
        href="service-detail.html?service=${service.key}"
      >
        ${
          image
          ? `<img src="${escapeHtml(image)}"
                  alt="${escapeHtml(service.title)}"
                  loading="lazy"
                  referrerpolicy="no-referrer">`
          : `<div style="position:absolute;inset:0;background:linear-gradient(145deg,#2a2117,#080706)"></div>`
        }

        <span class="card-number">${service.num}</span>

        <div class="card-content">
          <div class="card-label">${service.label}</div>
          <h2>${escapeHtml(service.title)}</h2>
          <p>${escapeHtml(service.desc)}</p>

          <div class="card-foot">
            <span class="detail-link">ดูรายละเอียด</span>
            <span class="round-arrow">→</span>
          </div>
        </div>
      </a>
    `;
  }).join("");
}

(async function(){

  try{
    const tree = await getTree();
    render(tree);
  }catch(error){

    console.error(error);

    grid.innerHTML = `
      <div class="error">
        ไม่สามารถโหลดภาพผลงานจริงได้ในขณะนี้<br>
        กรุณารีเฟรชหน้าอีกครั้ง
      </div>
    `;
  }

})();
</script>

</body>
</html>
