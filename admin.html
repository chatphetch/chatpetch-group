<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>เข้าสู่ระบบผู้ดูแล | CHATPHETCH GROUP</title>

  <meta
    name="description"
    content="ระบบเข้าสู่ระบบผู้ดูแลเว็บไซต์ บริษัท ฉัตรเพชรกรุ๊ป จำกัด"
  >

  <link
    rel="icon"
    type="image/png"
    href="assets/logo.png"
  >

  <!-- =========================================================
       SUPABASE
  ========================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* =========================================================
       RESET
    ========================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        Arial,
        "Noto Sans Thai",
        "Tahoma",
        sans-serif;

      background:
        linear-gradient(
          rgba(8, 18, 35, 0.82),
          rgba(8, 18, 35, 0.92)
        ),
        url("assets/index-main-bg.png") center center / cover
        no-repeat fixed;

      color: #172033;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    /* =========================================================
       BACKGROUND
    ========================================================== */

    .background-overlay {
      position: fixed;
      inset: 0;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(255,255,255,0.08),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(255,255,255,0.05),
          transparent 35%
        );

      pointer-events: none;
    }

    /* =========================================================
       LOGIN CARD
    ========================================================== */

    .login-wrapper {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 440px;
    }

    .login-card {
      width: 100%;

      background: rgba(255,255,255,0.97);

      border-radius: 24px;

      padding: 38px 34px 34px;

      box-shadow:
        0 25px 70px rgba(0,0,0,0.35);

      border:
        1px solid rgba(255,255,255,0.7);
    }

    /* =========================================================
       LOGO
    ========================================================== */

    .logo-area {
      display: flex;
      justify-content: center;
      align-items: center;

      margin-bottom: 22px;
    }

    .logo-area img {
      display: block;

      width: auto;
      max-width: 230px;
      max-height: 100px;

      object-fit: contain;
    }

    /* =========================================================
       TITLE
    ========================================================== */

    .title {
      text-align: center;

      font-size: 26px;
      font-weight: 800;

      color: #172033;

      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;

      color: #6b7280;

      font-size: 14px;

      line-height: 1.6;

      margin-bottom: 30px;
    }

    /* =========================================================
       FORM
    ========================================================== */

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;

      font-size: 14px;

      font-weight: 700;

      color: #263247;

      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;

      height: 52px;

      border:
        1px solid #d7dce5;

      border-radius: 12px;

      background: #ffffff;

      color: #172033;

      font-size: 15px;

      padding:
        0 16px;

      outline: none;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .form-input:focus {
      border-color: #1d4ed8;

      box-shadow:
        0 0 0 4px rgba(29,78,216,0.10);
    }

    .form-input::placeholder {
      color: #9ca3af;
    }

    /* =========================================================
       PASSWORD
    ========================================================== */

    .password-input {
      padding-right: 78px;
    }

    .password-toggle {
      position: absolute;

      top: 50%;
      right: 8px;

      transform: translateY(-50%);

      height: 38px;

      padding:
        0 12px;

      border: none;

      border-radius: 9px;

      background: #f1f5f9;

      color: #334155;

      font-size: 13px;

      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .password-toggle:hover {
      background: #e2e8f0;

      color: #0f172a;
    }

    .password-toggle:active {
      transform:
        translateY(-50%)
        scale(0.97);
    }

    /* =========================================================
       LOGIN BUTTON
    ========================================================== */

    .login-button {
      width: 100%;

      height: 54px;

      border: none;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #173b75,
          #0f2853
        );

      color: white;

      font-size: 16px;

      font-weight: 800;

      cursor: pointer;

      margin-top: 4px;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;
    }

    .login-button:hover:not(:disabled) {
      transform: translateY(-1px);

      box-shadow:
        0 10px 25px rgba(15,40,83,0.25);
    }

    .login-button:active:not(:disabled) {
      transform: translateY(0);
    }

    .login-button:disabled {
      cursor: not-allowed;

      opacity: 0.75;
    }

    .button-content {
      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;
    }

    /* =========================================================
       SPINNER
    ========================================================== */

    .spinner {
      width: 18px;
      height: 18px;

      border:
        2px solid rgba(255,255,255,0.35);

      border-top-color: #ffffff;

      border-radius: 50%;

      animation:
        spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================================================
       MESSAGE
    ========================================================== */

    .message {
      display: none;

      margin-top: 18px;

      padding:
        13px 15px;

      border-radius: 11px;

      font-size: 14px;

      line-height: 1.55;

      text-align: center;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fef2f2;

      color: #b91c1c;

      border:
        1px solid #fecaca;
    }

    .message.success {
      background: #f0fdf4;

      color: #15803d;

      border:
        1px solid #bbf7d0;
    }

    .message.info {
      background: #eff6ff;

      color: #1d4ed8;

      border:
        1px solid #bfdbfe;
    }

    /* =========================================================
       FALLBACK REDIRECT BUTTON
    ========================================================== */

    .dashboard-link {
      display: none;

      width: 100%;

      margin-top: 12px;

      padding: 13px 16px;

      border-radius: 11px;

      text-align: center;

      text-decoration: none;

      background: #e8eef8;

      color: #173b75;

      font-size: 14px;

      font-weight: 800;

      border:
        1px solid #d5dfef;
    }

    .dashboard-link.show {
      display: block;
    }

    .dashboard-link:hover {
      background: #dfe8f5;
    }

    /* =========================================================
       FOOTER
    ========================================================== */

    .footer {
      text-align: center;

      margin-top: 22px;

      color: rgba(255,255,255,0.78);

      font-size: 12px;

      line-height: 1.6;
    }

    .footer strong {
      color: #ffffff;
    }

    /* =========================================================
       DEBUG BOX
    ========================================================== */

    .debug-box {
      display: none;

      margin-top: 15px;

      padding: 12px;

      background: #111827;

      color: #d1d5db;

      border-radius: 10px;

      font-size: 11px;

      line-height: 1.5;

      word-break: break-word;
    }

    .debug-box.show {
      display: block;
    }

    /* =========================================================
       MOBILE
    ========================================================== */

    @media (max-width: 520px) {

      body {
        padding: 16px;
      }

      .login-card {
        padding:
          30px 22px 26px;

        border-radius: 20px;
      }

      .title {
        font-size: 23px;
      }

      .subtitle {
        font-size: 13px;

        margin-bottom: 25px;
      }

      .logo-area img {
        max-width: 190px;

        max-height: 85px;
      }

      .form-input {
        height: 50px;
      }

      .login-button {
        height: 52px;
      }
    }
  </style>
</head>

<body>

  <div class="background-overlay"></div>

  <main class="login-wrapper">

    <section class="login-card">

      <!-- =====================================================
           LOGO
      ====================================================== -->

      <div class="logo-area">

        <img
          src="assets/logo.png"
          alt="CHATPHETCH GROUP"
          onerror="this.style.display='none';"
        >

      </div>


      <!-- =====================================================
           TITLE
      ====================================================== -->

      <h1 class="title">
        ระบบผู้ดูแลเว็บไซต์
      </h1>

      <p class="subtitle">
        บริษัท ฉัตรเพชรกรุ๊ป จำกัด
        <br>
        CHATPHETCH GROUP
      </p>


      <!-- =====================================================
           LOGIN FORM
      ====================================================== -->

      <form
        id="adminLoginForm"
        autocomplete="on"
      >

        <!-- EMAIL -->

        <div class="form-group">

          <label
            class="form-label"
            for="adminEmail"
          >
            Email
          </label>

          <div class="input-wrapper">

            <input
              id="adminEmail"
              class="form-input"
              type="email"
              name="email"
              placeholder="กรอก Email"
              autocomplete="username"
              required
            >

          </div>

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

          <label
            class="form-label"
            for="adminPassword"
          >
            รหัสผ่าน
          </label>

          <div class="input-wrapper">

            <input
              id="adminPassword"
              class="form-input password-input"
              type="password"
              name="password"
              placeholder="กรอกรหัสผ่าน"
              autocomplete="current-password"
              required
            >

            <button
              id="passwordToggle"
              class="password-toggle"
              type="button"
              aria-label="แสดงรหัสผ่าน"
              aria-pressed="false"
            >
              แสดง
            </button>

          </div>

        </div>


        <!-- LOGIN BUTTON -->

        <button
          id="loginButton"
          class="login-button"
          type="submit"
        >

          <span
            id="loginButtonContent"
            class="button-content"
          >
            เข้าสู่ระบบ
          </span>

        </button>


        <!-- MESSAGE -->

        <div
          id="loginMessage"
          class="message"
          role="alert"
          aria-live="polite"
        ></div>


        <!-- FALLBACK DASHBOARD LINK -->

        <a
          id="dashboardLink"
          class="dashboard-link"
          href="./admin-dashboard.html"
        >
          เปิดระบบหลังบ้าน
        </a>


        <!-- DEBUG -->

        <div
          id="debugBox"
          class="debug-box"
        ></div>

      </form>

    </section>


    <!-- =======================================================
         FOOTER
    ======================================================== -->

    <div class="footer">

      <strong>
        CHATPHETCH GROUP
      </strong>

      <br>

      Admin Panel

    </div>

  </main>


  <!-- =========================================================
       JAVASCRIPT
  ========================================================== -->

  <script>

    /* =========================================================
       SUPABASE CONFIG
    ========================================================== */

    const SUPABASE_URL =
      "https://mfhllgklcfnnbyyzzljz.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_rkWSZF3He7_mhCIRY9MaNQ_JGBEa1l5";


    /* =========================================================
       CHECK SUPABASE LIBRARY
    ========================================================== */

    if (
      !window.supabase ||
      typeof window.supabase.createClient !== "function"
    ) {

      alert(
        "ไม่สามารถโหลด Supabase ได้ กรุณาตรวจสอบ Internet หรือ CDN"
      );

      throw new Error(
        "Supabase JavaScript library not loaded."
      );
    }


    /* =========================================================
       CREATE SUPABASE CLIENT
    ========================================================== */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {

            persistSession: true,

            autoRefreshToken: true,

            detectSessionInUrl: true

          }
        }
      );


    /* =========================================================
       DOM
    ========================================================== */

    const loginForm =
      document.getElementById(
        "adminLoginForm"
      );

    const emailInput =
      document.getElementById(
        "adminEmail"
      );

    const passwordInput =
      document.getElementById(
        "adminPassword"
      );

    const passwordToggle =
      document.getElementById(
        "passwordToggle"
      );

    const loginButton =
      document.getElementById(
        "loginButton"
      );

    const loginButtonContent =
      document.getElementById(
        "loginButtonContent"
      );

    const loginMessage =
      document.getElementById(
        "loginMessage"
      );

    const dashboardLink =
      document.getElementById(
        "dashboardLink"
      );

    const debugBox =
      document.getElementById(
        "debugBox"
      );


    /* =========================================================
       SHOW MESSAGE
    ========================================================== */

    function showMessage(
      message,
      type = "error"
    ) {

      loginMessage.textContent =
        message;

      loginMessage.className =
        "message show " + type;
    }


    /* =========================================================
       CLEAR MESSAGE
    ========================================================== */

    function clearMessage() {

      loginMessage.textContent =
        "";

      loginMessage.className =
        "message";
    }


    /* =========================================================
       DEBUG
    ========================================================== */

    function showDebug(message) {

      debugBox.textContent =
        message;

      debugBox.className =
        "debug-box show";
    }


    /* =========================================================
       HIDE DEBUG
    ========================================================== */

    function hideDebug() {

      debugBox.textContent =
        "";

      debugBox.className =
        "debug-box";
    }


    /* =========================================================
       LOADING STATE
    ========================================================== */

    function setLoading(
      loading
    ) {

      loginButton.disabled =
        loading;

      if (loading) {

        loginButtonContent.innerHTML =

          '<span class="spinner"></span>' +

          '<span>กำลังเข้าสู่ระบบ...</span>';

      } else {

        loginButtonContent.innerHTML =

          '<span>เข้าสู่ระบบ</span>';

      }

    }


    /* =========================================================
       PASSWORD TOGGLE
    ========================================================== */

    passwordToggle.addEventListener(
      "click",
      function () {

        if (
          passwordInput.type ===
          "password"
        ) {

          passwordInput.type =
            "text";

          passwordToggle.textContent =
            "ซ่อน";

          passwordToggle.setAttribute(
            "aria-label",
            "ซ่อนรหัสผ่าน"
          );

          passwordToggle.setAttribute(
            "aria-pressed",
            "true"
          );

        } else {

          passwordInput.type =
            "password";

          passwordToggle.textContent =
            "แสดง";

          passwordToggle.setAttribute(
            "aria-label",
            "แสดงรหัสผ่าน"
          );

          passwordToggle.setAttribute(
            "aria-pressed",
            "false"
          );

        }

        passwordInput.focus();

      }
    );


    /* =========================================================
       GET DASHBOARD URL
    ========================================================== */

    function getDashboardURL() {

      /*
        ใช้ ./admin-dashboard.html
        เพื่อให้ทำงานได้ทั้ง

        https://chatpetch.github.io/chatpetch-group/

        และกรณีเปลี่ยนชื่อ Repository / Domain
      */

      return new URL(
        "./admin-dashboard.html",
        window.location.href
      ).href;

    }


    /* =========================================================
       REDIRECT TO DASHBOARD
    ========================================================== */

    function redirectToDashboard() {

      const dashboardURL =
        getDashboardURL();

      console.log(
        "Dashboard URL:",
        dashboardURL
      );

      showDebug(
        "กำลังเปิด: " +
        dashboardURL
      );


      /*
        ใช้ location.assign
        แทนการเปลี่ยน innerHTML หรือ timeout อย่างเดียว
      */

      window.location.assign(
        dashboardURL
      );

    }


    /* =========================================================
       LOGIN
    ========================================================== */

    loginForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        clearMessage();

        hideDebug();

        dashboardLink.className =
          "dashboard-link";


        /* -----------------------------------------------------
           GET VALUES
        ------------------------------------------------------ */

        const email =
          emailInput.value
            .trim()
            .toLowerCase();

        const password =
          passwordInput.value;


        /* -----------------------------------------------------
           VALIDATION
        ------------------------------------------------------ */

        if (!email) {

          showMessage(
            "กรุณากรอก Email",
            "error"
          );

          emailInput.focus();

          return;
        }


        if (!password) {

          showMessage(
            "กรุณากรอกรหัสผ่าน",
            "error"
          );

          passwordInput.focus();

          return;
        }


        /* -----------------------------------------------------
           LOADING
        ------------------------------------------------------ */

        setLoading(true);


        try {

          console.log(
            "กำลังเข้าสู่ระบบ..."
          );


          /* ---------------------------------------------------
             SUPABASE LOGIN
          ---------------------------------------------------- */

          const {
            data,
            error
          } =
            await supabaseClient.auth.signInWithPassword({

              email:
                email,

              password:
                password

            });


          console.log(
            "Supabase login result:",
            data,
            error
          );


          /* ---------------------------------------------------
             LOGIN ERROR
          ---------------------------------------------------- */

          if (error) {

            throw error;

          }


          /* ---------------------------------------------------
             CHECK USER
          ---------------------------------------------------- */

          if (
            !data ||
            !data.user
          ) {

            throw new Error(
              "เข้าสู่ระบบสำเร็จ แต่ไม่พบข้อมูล User"
            );

          }


          console.log(
            "LOGIN SUCCESS:",
            data.user.email
          );


          /* ---------------------------------------------------
             CHECK SESSION
          ---------------------------------------------------- */

          const {
            data:
              sessionData,
            error:
              sessionError
          } =
            await supabaseClient.auth.getSession();


          if (sessionError) {

            throw sessionError;

          }


          if (
            !sessionData ||
            !sessionData.session
          ) {

            throw new Error(
              "เข้าสู่ระบบสำเร็จ แต่ไม่พบ Session"
            );

          }


          console.log(
            "SESSION SUCCESS"
          );


          /* ---------------------------------------------------
             SUCCESS MESSAGE
          ---------------------------------------------------- */

          showMessage(
            "เข้าสู่ระบบสำเร็จ กำลังเปิดระบบหลังบ้าน...",
            "success"
          );


          loginButton.disabled =
            true;

          loginButtonContent.innerHTML =

            '<span class="spinner"></span>' +

            '<span>กำลังเปิดระบบหลังบ้าน...</span>';


          /* ---------------------------------------------------
             DASHBOARD URL
          ---------------------------------------------------- */

          const dashboardURL =
            getDashboardURL();


          console.log(
            "REDIRECT:",
            dashboardURL
          );


          /*
            รอเล็กน้อยให้ Supabase
            บันทึก Session ลง Browser ก่อน
          */

          setTimeout(
            function () {

              redirectToDashboard();

            },
            500
          );


          /*
            Fallback:
            ถ้า Browser ไม่เปลี่ยนหน้า
            ให้แสดงปุ่มเปิดระบบหลังบ้าน
          */

          setTimeout(
            function () {

              dashboardLink.className =
                "dashboard-link show";

              loginButton.disabled =
                false;

              loginButtonContent.innerHTML =
                "<span>เข้าสู่ระบบ</span>";

              showMessage(
                "เข้าสู่ระบบแล้ว หากหน้ายังไม่เปลี่ยน กรุณากดปุ่ม \"เปิดระบบหลังบ้าน\"",
                "success"
              );

            },
            3000
          );


        } catch (error) {

          console.error(
            "LOGIN ERROR:",
            error
          );


          /* ---------------------------------------------------
             ERROR MESSAGE
          ---------------------------------------------------- */

          let message =
            "เข้าสู่ระบบไม่สำเร็จ";


          if (
            error &&
            error.message
          ) {

            const errorText =
              error.message.toLowerCase();


            if (
              errorText.includes(
                "invalid login credentials"
              )
            ) {

              message =
                "Email หรือรหัสผ่านไม่ถูกต้อง";


            } else if (
              errorText.includes(
                "email not confirmed"
              )
            ) {

              message =
                "Email ของบัญชีนี้ยังไม่ได้รับการยืนยัน";


            } else if (
              errorText.includes(
                "too many requests"
              )
            ) {

              message =
                "มีการเข้าสู่ระบบหลายครั้งเกินไป กรุณารอสักครู่";


            } else if (
              errorText.includes(
                "network"
              )
            ) {

              message =
                "ไม่สามารถเชื่อมต่อระบบได้ กรุณาตรวจสอบ Internet";


            } else {

              message =
                error.message;

            }

          }


          showMessage(
            message,
            "error"
          );


          showDebug(
            error &&
            error.message
              ? error.message
              : String(error)
          );


          setLoading(false);

        }

      }
    );


    /* =========================================================
       ENTER KEY
    ========================================================== */

    emailInput.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "Enter"
        ) {

          passwordInput.focus();

        }

      }
    );


    /* =========================================================
       CHECK CURRENT SESSION
    ========================================================== */

    async function checkCurrentSession() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();


        if (error) {

          console.warn(
            "Session check error:",
            error
          );

          return;

        }


        if (
          data &&
          data.session &&
          data.session.user
        ) {

          console.log(
            "มี Session อยู่แล้ว:",
            data.session.user.email
          );

        } else {

          console.log(
            "ยังไม่มี Session"
          );

        }

      } catch (error) {

        console.error(
          "CHECK SESSION ERROR:",
          error
        );

      }

    }


    /* =========================================================
       AUTH STATE CHANGE
    ========================================================== */

    supabaseClient.auth.onAuthStateChange(
      function (
        event,
        session
      ) {

        console.log(
          "AUTH EVENT:",
          event,
          session
            ? session.user.email
            : null
        );
