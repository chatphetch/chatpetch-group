<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#080604"
  >

  <title>
    Admin Login | CHATPHETCH GROUP
  </title>


  <!-- =====================================================
       FONT
  ====================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <!-- =====================================================
       SUPABASE
  ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- =====================================================
       STYLE
  ====================================================== -->

  <style>

    :root{

      --gold:#c9a85a;

      --gold-light:#e6cc7c;

      --cream:#f5ede1;

      --text:#eee6dc;

      --muted:rgba(245,237,225,.55);

      --line:rgba(201,168,90,.25);

      --dark:#080604;

      --panel:rgba(8,6,4,.88);

    }


    *{

      box-sizing:border-box;

    }


    html{

      min-height:100%;

      background:
        var(--dark);

    }


    body{

      margin:0;

      min-height:100vh;

      color:
        var(--text);

      font-family:
        "Prompt",
        "Kanit",
        sans-serif;

      background:
        var(--dark);

      overflow-x:hidden;

    }


    /* =====================================================
       BACKGROUND
    ====================================================== */

    .page-background{

      position:fixed;

      inset:0;

      z-index:0;

      background:

        linear-gradient(
          90deg,
          rgba(0,0,0,.88) 0%,
          rgba(0,0,0,.65) 42%,
          rgba(0,0,0,.60) 100%
        ),

        linear-gradient(
          180deg,
          rgba(0,0,0,.25) 0%,
          rgba(0,0,0,.55) 100%
        ),

        url("assets/index-main-bg.png")
        center center /
        cover
        no-repeat;

    }


    .page-background::after{

      content:"";

      position:absolute;

      inset:0;

      background:
        radial-gradient(
          circle at 72% 42%,
          rgba(201,168,90,.12),
          transparent 35%
        );

    }


    /* =====================================================
       MAIN
    ====================================================== */

    .page{

      position:relative;

      z-index:1;

      min-height:100vh;

      display:flex;

      align-items:center;

      justify-content:center;

      padding:30px;

    }


    .login-wrapper{

      width:
        min(
          1100px,
          100%
        );

      display:grid;

      grid-template-columns:
        1.05fr
        .95fr;

      min-height:620px;

      border:
        1px solid
        rgba(201,168,90,.25);

      background:
        rgba(5,4,3,.56);

      box-shadow:
        0 35px 100px
        rgba(0,0,0,.70);

      backdrop-filter:
        blur(8px);

    }


    /* =====================================================
       LEFT
    ====================================================== */

    .brand-side{

      position:relative;

      display:flex;

      flex-direction:column;

      justify-content:center;

      padding:
        65px;

      border-right:
        1px solid
        rgba(201,168,90,.15);

      overflow:hidden;

    }


    .brand-side::before{

      content:"";

      position:absolute;

      inset:0;

      background:
        radial-gradient(
          circle at 30% 50%,
          rgba(201,168,90,.10),
          transparent 60%
        );

      pointer-events:none;

    }


    .logo{

      position:relative;

      width:145px;

      height:145px;

      object-fit:contain;

      margin-bottom:30px;

      filter:
        drop-shadow(
          0 15px 30px
          rgba(0,0,0,.5)
        );

    }


    .brand-kicker{

      position:relative;

      color:
        var(--gold-light);

      font-size:11px;

      font-weight:600;

      letter-spacing:4px;

      margin-bottom:15px;

    }


    .brand-title{

      position:relative;

      margin:0;

      color:#fff;

      font-family:
        "Kanit",
        sans-serif;

      font-size:
        clamp(
          42px,
          5vw,
          72px
        );

      line-height:.95;

      font-weight:500;

    }


    .brand-subtitle{

      position:relative;

      margin-top:13px;

      color:
        var(--gold-light);

      font-family:
        "Kanit",
        sans-serif;

      font-size:15px;

      letter-spacing:4px;

    }


    .brand-description{

      position:relative;

      max-width:480px;

      margin:
        25px 0 0;

      color:
        rgba(245,237,225,.58);

      font-size:13px;

      line-height:1.9;

    }


    .brand-line{

      position:relative;

      width:70px;

      height:1px;

      margin-top:30px;

      background:
        var(--gold);

    }


    /* =====================================================
       RIGHT LOGIN
    ====================================================== */

    .login-side{

      display:flex;

      align-items:center;

      justify-content:center;

      padding:
        50px;

      background:
        rgba(5,4,3,.70);

    }


    .login-card{

      width:100%;

      max-width:390px;

    }


    .login-label{

      color:
        var(--gold-light);

      font-size:10px;

      font-weight:600;

      letter-spacing:3px;

      margin-bottom:8px;

    }


    .login-title{

      margin:0;

      color:#fff;

      font-family:
        "Kanit",
        sans-serif;

      font-size:35px;

      font-weight:500;

    }


    .login-description{

      margin:
        9px 0 28px;

      color:
        var(--muted);

      font-size:12px;

      line-height:1.8;

    }


    /* =====================================================
       FIELD
    ====================================================== */

    .field{

      margin-bottom:17px;

    }


    .field-label{

      display:block;

      margin-bottom:7px;

      color:#d9d0c4;

      font-size:11px;

    }


    .required{

      color:
        var(--gold-light);

    }


    .input{

      width:100%;

      height:50px;

      padding:
        0 15px;

      color:#fff;

      background:
        rgba(0,0,0,.50);

      border:
        1px solid
        rgba(201,168,90,.20);

      outline:none;

      font-family:
        "Prompt",
        sans-serif;

      font-size:13px;

      transition:
        .2s ease;

    }


    .input::placeholder{

      color:
        rgba(255,255,255,.25);

    }


    .input:hover{

      border-color:
        rgba(201,168,90,.35);

    }


    .input:focus{

      border-color:
        var(--gold);

      background:
        rgba(201,168,90,.035);

      box-shadow:
        0 0 0 2px
        rgba(201,168,90,.05);

    }


    /* =====================================================
       PASSWORD
    ====================================================== */

    .password-box{

      position:relative;

    }


    .password-box .input{

      padding-right:82px;

    }


    .password-toggle{

      position:absolute;

      top:5px;

      right:5px;

      width:70px;

      height:40px;

      padding:0;

      border:
        1px solid
        rgba(201,168,90,.14);

      color:
        var(--gold-light);

      background:
        rgba(201,168,90,.06);

      font-family:
        "Prompt",
        sans-serif;

      font-size:10px;

      cursor:pointer;

      z-index:5;

      pointer-events:auto;

      transition:
        .2s ease;

    }


    .password-toggle:hover{

      color:#111;

      background:
        var(--gold-light);

    }


    .password-toggle:active{

      transform:
        scale(.97);

    }


    /* =====================================================
       LOGIN BUTTON
    ====================================================== */

    .login-button{

      position:relative;

      width:100%;

      height:52px;

      margin-top:8px;

      border:0;

      color:#111;

      background:
        linear-gradient(
          135deg,
          #ead184,
          #b99048
        );

      font-family:
        "Prompt",
        sans-serif;

      font-size:12px;

      font-weight:700;

      cursor:pointer;

      transition:
        .2s ease;

      box-shadow:
        0 12px 25px
        rgba(0,0,0,.25);

    }


    .login-button:hover{

      transform:
        translateY(-2px);

      box-shadow:
        0 18px 35px
        rgba(0,0,0,.35);

    }


    .login-button:active{

      transform:
        translateY(0);

    }


    .login-button:disabled{

      opacity:.55;

      cursor:not-allowed;

      transform:none;

    }


    /* =====================================================
       MESSAGE
    ====================================================== */

    .message{

      display:none;

      margin-top:15px;

      padding:
        12px 14px;

      border:
        1px solid;

      font-size:11px;

      line-height:1.8;

    }


    .message.show{

      display:block;

    }


    .message.error{

      color:#efaaa0;

      border-color:
        rgba(220,80,70,.30);

      background:
        rgba(100,25,20,.15);

    }


    .message.success{

      color:#cfe5c7;

      border-color:
        rgba(90,180,100,.25);

      background:
        rgba(40,100,45,.12);

    }


    /* =====================================================
       FOOTER
    ====================================================== */

    .login-footer{

      margin-top:25px;

      padding-top:18px;

      border-top:
        1px solid
        rgba(255,255,255,.07);

      color:
        rgba(255,255,255,.32);

      font-size:9px;

      line-height:1.7;

      text-align:center;

    }


    /* =====================================================
       LOADING
    ====================================================== */

    .button-content{

      display:flex;

      align-items:center;

      justify-content:center;

      gap:9px;

    }


    .spinner{

      width:15px;

      height:15px;

      border:
        2px solid
        rgba(0,0,0,.22);

      border-top-color:
        #111;

      border-radius:50%;

      animation:
        spin .7s linear infinite;

    }


    @keyframes spin{

      to{

        transform:
          rotate(360deg);

      }

    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media(max-width:800px){

      .page{

        padding:15px;

      }


      .login-wrapper{

        grid-template-columns:1fr;

      }


      .brand-side{

        min-height:320px;

        padding:38px 30px;

        border-right:0;

        border-bottom:
          1px solid
          rgba(201,168,90,.15);

      }


      .logo{

        width:85px;

        height:85px;

        margin-bottom:20px;

      }


      .brand-title{

        font-size:42px;

      }


      .brand-description{

        margin-top:16px;

        font-size:11px;

      }


      .brand-line{

        margin-top:20px;

      }


      .login-side{

        padding:
          38px 25px;

      }

    }


    @media(max-width:480px){

      .brand-side{

        min-height:270px;

      }


      .brand-title{

        font-size:35px;

      }


      .brand-subtitle{

        font-size:11px;

        letter-spacing:3px;

      }


      .brand-description{

        display:none;

      }


      .login-side{

        padding:
          32px 20px;

      }


      .login-title{

        font-size:30px;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       BACKGROUND
  ====================================================== -->

  <div class="page-background"></div>


  <!-- =====================================================
       PAGE
  ====================================================== -->

  <main class="page">


    <div class="login-wrapper">


      <!-- =================================================
           BRAND
      ================================================== -->

      <section class="brand-side">


        <img
          src="assets/logo.png"
          class="logo"
          alt="CHATPHETCH GROUP"
        >


        <div class="brand-kicker">
          BACK-OFFICE SYSTEM
        </div>


        <h1 class="brand-title">
          CHATPHETCH
        </h1>


        <div class="brand-subtitle">
          GROUP
        </div>


        <p class="brand-description">

          ระบบบริหารจัดการเว็บไซต์และข้อมูลหลังบ้าน
          สำหรับทีมงาน CHATPHETCH GROUP

        </p>


        <div class="brand-line"></div>


      </section>



      <!-- =================================================
           LOGIN
      ================================================== -->

      <section class="login-side">


        <div class="login-card">


          <div class="login-label">
            ADMINISTRATOR
          </div>


          <h2 class="login-title">
            เข้าสู่ระบบ
          </h2>


          <p class="login-description">

            กรุณาเข้าสู่ระบบด้วยบัญชีผู้ดูแลเว็บไซต์
            เพื่อจัดการข้อมูลหลังบ้าน

          </p>



          <!-- =============================================
               FORM
          ============================================== -->

          <form
            id="adminLoginForm"
            autocomplete="on"
          >


            <!-- EMAIL -->

            <div class="field">

              <label
                class="field-label"
                for="adminEmail"
              >
                Email
                <span class="required">*</span>
              </label>


              <input
                id="adminEmail"
                name="email"
                class="input"
                type="email"
                autocomplete="username"
                inputmode="email"
                required
                placeholder="admin@example.com"
              >

            </div>



            <!-- PASSWORD -->

            <div class="field">

              <label
                class="field-label"
                for="adminPassword"
              >
                รหัสผ่าน
                <span class="required">*</span>
              </label>


              <div class="password-box">


                <input
                  id="adminPassword"
                  name="password"
                  class="input"
                  type="password"
                  autocomplete="current-password"
                  required
                  placeholder="กรอกรหัสผ่าน"
                >


                <button
                  id="passwordToggle"
                  class="password-toggle"
                  type="button"
                  aria-label="แสดงรหัสผ่าน"
                  aria-pressed="false"
                >
                  แสดง
                </button>


              </div>

            </div>



            <!-- LOGIN BUTTON -->

            <button
              id="loginButton"
              class="login-button"
              type="submit"
            >

              <span
                id="loginButtonContent"
                class="button-content"
              >
                เข้าสู่ระบบ
              </span>

            </button>



            <!-- MESSAGE -->

            <div
              id="loginMessage"
              class="message"
              role="alert"
              aria-live="polite"
            ></div>


          </form>



          <div class="login-footer">

            ระบบสำหรับผู้ดูแลเว็บไซต์เท่านั้น<br>

            CHATPHETCH GROUP · ADMIN SYSTEM

          </div>


        </div>

      </section>


    </div>

  </main>



  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>


    /* =====================================================
       SUPABASE CONFIG
    ====================================================== */

    const SUPABASE_URL =
      "https://mfhllgklcfnnbyyzzljz.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_rkWSZF3He7_mhCIRY9MaNQ_JGBEa1l5";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {

          auth:{

            persistSession:true,

            autoRefreshToken:true,

            detectSessionInUrl:true,

            flowType:"pkce"

          }

        }
      );



    /* =====================================================
       ELEMENTS
    ====================================================== */

    const loginForm =
      document.getElementById(
        "adminLoginForm"
      );


    const emailInput =
      document.getElementById(
        "adminEmail"
      );


    const passwordInput =
      document.getElementById(
        "adminPassword"
      );


    const passwordToggle =
      document.getElementById(
        "passwordToggle"
      );


    const loginButton =
      document.getElementById(
        "loginButton"
      );


    const loginButtonContent =
      document.getElementById(
        "loginButtonContent"
      );


    const loginMessage =
      document.getElementById(
        "loginMessage"
      );



    /* =====================================================
       SHOW / HIDE PASSWORD
    ====================================================== */

    passwordToggle.addEventListener(
      "click",
      function(){

        const isPassword =
          passwordInput.type ===
          "password";


        if(isPassword){

          passwordInput.type =
            "text";

          passwordToggle.textContent =
            "ซ่อน";

          passwordToggle.setAttribute(
            "aria-label",
            "ซ่อนรหัสผ่าน"
          );

          passwordToggle.setAttribute(
            "aria-pressed",
            "true"
          );

        }else{

          passwordInput.type =
            "password";

          passwordToggle.textContent =
            "แสดง";

          passwordToggle.setAttribute(
            "aria-label",
            "แสดงรหัสผ่าน"
          );

          passwordToggle.setAttribute(
            "aria-pressed",
            "false"
          );

        }

        passwordInput.focus();

      }
    );



    /* =====================================================
       MESSAGE
    ====================================================== */

    function showMessage(
      message,
      type = "error"
    ){

      loginMessage.textContent =
        message;

      loginMessage.className =
        "message show " +
        type;

    }


    function clearMessage(){

      loginMessage.textContent =
        "";

      loginMessage.className =
        "message";

    }



    /* =====================================================
       LOADING BUTTON
    ====================================================== */

    function setLoading(
      loading
    ){

      loginButton.disabled =
        loading;


      if(loading){

        loginButtonContent.innerHTML = `

          <span class="spinner"></span>

          กำลังเข้าสู่ระบบ...

        `;

      }else{

        loginButtonContent.textContent =
          "เข้าสู่ระบบ";

      }

    }



    /* =====================================================
       LOGIN
    ====================================================== */

    loginForm.addEventListener(
      "submit",
      async function(event){

        event.preventDefault();


        clearMessage();


        const email =
          emailInput.value
            .trim()
            .toLowerCase();


        const password =
          passwordInput.value;


        if(!email){

          showMessage(
            "กรุณากรอก Email"
          );

          emailInput.focus();

          return;

        }


        if(!password){

          showMessage(
            "กรุณากรอกรหัสผ่าน"
          );

          passwordInput.focus();

          return;

        }


        setLoading(true);


        try{


          /* =============================================
             SUPABASE AUTH
          ============================================== */

          const {
            data,
            error
          } =
            await supabaseClient
              .auth
              .signInWithPassword({

                email:
                  email,

                password:
                  password

              });


          if(error){

            throw error;

          }


          if(
            !data ||
            !data.session
          ){

            throw new Error(
              "เข้าสู่ระบบไม่สำเร็จ ไม่พบ Session"
            );

          }


          showMessage(
            "เข้าสู่ระบบสำเร็จ กำลังเปิดระบบหลังบ้าน...",
            "success"
          );


          /*
           * รอเล็กน้อยเพื่อให้ Supabase
           * บันทึก Session ลง browser ก่อน
           */

          await new Promise(
            resolve =>
              setTimeout(
                resolve,
                500
              )
          );


          /* =============================================
             REDIRECT
          ============================================== */

          window.location.href =
            "admin-dashboard.html";


        }catch(error){

          console.error(
            "ADMIN LOGIN ERROR:",
            error
          );


          let message =
            "ไม่สามารถเข้าสู่ระบบได้";


          if(
            error &&
            error.message
          ){

            const text =
              error.message
                .toLowerCase();


            if(
              text.includes(
                "invalid login credentials"
              )
            ){

              message =
                "Email หรือรหัสผ่านไม่ถูกต้อง";

            }else if(
              text.includes(
                "email not confirmed"
              )
            ){

              message =
                "บัญชีนี้ยังไม่ได้ยืนยัน Email ใน Supabase";

            }else if(
              text.includes(
                "too many requests"
              )
            ){

              message =
                "มีการเข้าสู่ระบบหลายครั้งเกินไป กรุณารอสักครู่แล้วลองใหม่";

            }else{

              message =
                error.message;

            }

          }


          showMessage(
            message,
            "error"
          );


          setLoading(false);

        }

      }
    );



    /* =====================================================
       CHECK EXISTING SESSION
    ====================================================== */

    async function checkExistingSession(){

      try{

        const {
          data,
          error
        } =
          await supabaseClient
            .auth
            .getSession();


        if(error){

          console.error(
            error
          );

          return;

        }


        if(
          data &&
          data.session
        ){

          /*
           * ถ้า Login อยู่แล้ว
           * เปิด Dashboard ได้เลย
           */

          window.location.href =
            "admin-dashboard.html";

        }

      }catch(error){

        console.error(
          error
        );

      }

    }



    /* =====================================================
       AUTH STATE
    ====================================================== */

    supabaseClient
      .auth
      .onAuthStateChange(
        function(
          event,
          session
        ){

          if(
            event ===
            "SIGNED_OUT"
          ){

            return;

          }

        }
      );



    /* =====================================================
       START
    ====================================================== */

    checkExistingSession();


  </script>

</body>

</html>
