<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#070504">
<title>รายละเอียดผลงาน | CHATPHETCH GROUP</title>
<meta name="description" content="รายละเอียดผลงานและภาพผลงานของ CHATPHETCH GROUP">

<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#c9a45c;
  --gold2:#e4c57f;
  --white:#f7f0e8;
  --text:#ded4c8;
  --muted:#a99e92;
  --black:#050403;
  --line:rgba(201,164,92,.22);
  --max:1240px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  background:#050403;
  color:var(--text);
  font-family:"Prompt","Kanit",sans-serif;
}
a{color:inherit;text-decoration:none}
button{font:inherit}
img{display:block;max-width:100%}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  pointer-events:none;
  background:url("assets/index-main-bg.png") center top/cover no-repeat;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    linear-gradient(180deg,
      rgba(0,0,0,.42) 0%,
      rgba(0,0,0,.28) 24%,
      rgba(0,0,0,.52) 60%,
      rgba(0,0,0,.92) 100%);
}

.container{
  width:min(var(--max),calc(100% - 80px));
  margin:auto;
}

/* HERO */
.detail-hero{
  position:relative;
  min-height:560px;
  display:flex;
  align-items:flex-end;
  padding:145px 0 70px;
  overflow:hidden;
  border-bottom:1px solid rgba(255,255,255,.07);
}
.detail-hero::before{
  content:"";
  position:absolute;
  left:-120px;
  top:80px;
  width:900px;
  height:500px;
  background:radial-gradient(ellipse at center,
    rgba(0,0,0,.76) 0%,
    rgba(0,0,0,.42) 45%,
    transparent 78%);
  pointer-events:none;
}
.detail-hero::after{
  content:"PROJECT";
  position:absolute;
  right:-25px;
  bottom:-20px;
  color:rgba(255,255,255,.025);
  font-family:"Kanit",sans-serif;
  font-size:145px;
  line-height:1;
  letter-spacing:4px;
  pointer-events:none;
}
.hero-content{
  position:relative;
  z-index:2;
  width:min(900px,100%);
}
.eyebrow{
  display:flex;
  align-items:center;
  gap:12px;
  color:var(--gold2);
  font-size:11px;
  letter-spacing:3px;
}
.eyebrow::before{
  content:"";
  width:40px;
  height:1px;
  background:var(--gold);
}
.detail-title{
  margin:17px 0 0;
  color:#fff;
  font-family:"Kanit",sans-serif;
  font-size:clamp(42px,6vw,76px);
  line-height:1.05;
  font-weight:400;
  text-shadow:0 8px 35px rgba(0,0,0,.75);
}
.detail-title span{
  display:block;
  margin-top:12px;
  color:var(--gold2);
  font-size:14px;
  letter-spacing:4px;
  font-family:"Prompt",sans-serif;
}
.hero-line{
  width:75px;
  height:1px;
  margin-top:24px;
  background:linear-gradient(90deg,var(--gold),transparent);
}
.detail-summary{
  max-width:760px;
  margin:18px 0 0;
  color:rgba(247,240,232,.78);
  font-size:14px;
  line-height:1.95;
}

/* MAIN */
.detail-main{padding:55px 0 95px}
.top-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:28px;
}
.action-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:42px;
  padding:0 17px;
  border:1px solid rgba(201,164,92,.30);
  background:rgba(10,7,5,.72);
  color:#d8c6a8;
  font-size:11px;
  transition:.2s ease;
}
.action-btn:hover{
  border-color:var(--gold2);
  color:#160e05;
  background:linear-gradient(135deg,#e4c57f,#b18442);
}
.action-btn.primary{
  border-color:var(--gold2);
  color:#160e05;
  background:linear-gradient(135deg,#ead18d,#b88837);
}

.detail-layout{
  display:grid;
  grid-template-columns:360px minmax(0,1fr);
  gap:22px;
  align-items:start;
}
.info-panel{
  position:sticky;
  top:105px;
  padding:28px;
  border:1px solid rgba(201,164,92,.22);
  background:linear-gradient(145deg,rgba(22,14,9,.94),rgba(5,4,3,.96));
}
.info-kicker{
  color:var(--gold2);
  font-size:9px;
  letter-spacing:2.5px;
}
.info-title{
  margin:8px 0 8px;
  color:#fff;
  font-family:"Kanit",sans-serif;
  font-size:30px;
  line-height:1.15;
  font-weight:400;
}
.info-subtitle{
  color:#8f8477;
  font-size:10px;
  letter-spacing:1.3px;
  line-height:1.7;
}
.info-line{
  width:60px;
  height:1px;
  margin:22px 0;
  background:linear-gradient(90deg,var(--gold),transparent);
}
.info-text{
  color:#a69b8e;
  font-size:12px;
  line-height:1.9;
}
.info-list{
  display:grid;
  gap:9px;
  margin-top:22px;
}
.info-item{
  padding:13px 14px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.015);
}
.info-item small{
  display:block;
  margin-bottom:4px;
  color:var(--gold);
  font-size:9px;
  letter-spacing:1.2px;
}
.info-item strong{
  display:block;
  color:#ddd2c6;
  font-size:12px;
  font-weight:400;
  line-height:1.55;
}

/* GALLERY */
.gallery-panel{
  min-width:0;
}
.gallery-heading{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:16px;
}
.gallery-kicker{
  color:var(--gold2);
  font-size:9px;
  letter-spacing:2.5px;
}
.gallery-title{
  margin:6px 0 0;
  color:#fff;
  font-family:"Kanit",sans-serif;
  font-size:32px;
  font-weight:400;
}
.gallery-count{
  color:#8f8477;
  font-size:10px;
  white-space:nowrap;
}
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}
.gallery-card{
  position:relative;
  aspect-ratio:16/10;
  overflow:hidden;
  border:1px solid rgba(201,164,92,.20);
  background:#0d0906;
  cursor:pointer;
}
.gallery-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .45s ease,filter .35s ease;
}
.gallery-card:hover img{
  transform:scale(1.045);
  filter:brightness(1.07);
}
.gallery-card::after{
  content:"เปิดภาพ";
  position:absolute;
  right:10px;
  bottom:10px;
  padding:5px 8px;
  border:1px solid rgba(228,197,127,.35);
  background:rgba(0,0,0,.62);
  color:#fff;
  font-size:9px;
  opacity:0;
  transition:.2s;
}
.gallery-card:hover::after{opacity:1}
.gallery-number{
  position:absolute;
  left:10px;
  top:10px;
  z-index:2;
  padding:5px 8px;
  border:1px solid rgba(228,197,127,.28);
  background:rgba(0,0,0,.58);
  color:var(--gold2);
  font-size:9px;
}

/* EMPTY / LOADING */
.loading-box,.empty-box{
  padding:65px 25px;
  border:1px solid var(--line);
  background:rgba(10,7,5,.72);
  text-align:center;
  color:#9e9487;
  font-size:11px;
}
.loading-box{grid-column:1/-1}
.spinner{
  width:30px;height:30px;margin:0 auto 15px;
  border:2px solid rgba(201,164,92,.15);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{
  padding:28px;
  border:1px solid rgba(201,164,92,.28);
  background:rgba(35,23,13,.62);
  color:#c7bba9;
  line-height:1.9;
}
.error-box strong{
  display:block;
  margin-bottom:7px;
  color:var(--gold2);
  font-family:"Kanit",sans-serif;
  font-size:20px;
  font-weight:400;
}

/* BOTTOM CTA */
.bottom-cta{
  margin-top:50px;
  padding:38px 34px;
  border:1px solid rgba(201,164,92,.27);
  background:
    linear-gradient(135deg,rgba(38,24,13,.72),rgba(6,4,3,.90)),
    radial-gradient(circle at 90% 10%,rgba(201,164,92,.12),transparent 35%);
}
.bottom-cta h2{
  margin:0 0 7px;
  color:#fff;
  font-family:"Kanit",sans-serif;
  font-size:31px;
  font-weight:400;
}
.bottom-cta p{
  margin:0 0 20px;
  color:#a69b8e;
  font-size:12px;
  line-height:1.85;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(0,0,0,.94);
  backdrop-filter:blur(12px);
}
.modal.open{display:flex}
.modal-box{
  width:min(1180px,100%);
  max-height:94vh;
  overflow:hidden;
  border:1px solid rgba(201,164,92,.30);
  background:#090604;
  box-shadow:0 35px 110px rgba(0,0,0,.8);
}
.modal-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:15px 18px;
  border-bottom:1px solid rgba(201,164,92,.14);
}
.modal-title{
  margin:0;
  color:#fff;
  font-family:"Kanit",sans-serif;
  font-size:23px;
  font-weight:400;
}
.modal-counter{margin-top:2px;color:#918678;font-size:9px}
.modal-close{
  width:40px;height:40px;
  border:1px solid rgba(201,164,92,.30);
  background:rgba(201,164,92,.05);
  color:#fff;
  cursor:pointer;
  font-size:22px;
}
.modal-stage{
  position:relative;
  min-height:480px;
  max-height:calc(94vh - 140px);
  display:flex;
  align-items:center;
  justify-content:center;
  background:#030303;
}
.modal-stage img{
  max-width:100%;
  max-height:calc(94vh - 180px);
  width:auto;height:auto;
  object-fit:contain;
}
.gallery-nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:2;
  width:48px;height:48px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:50%;
  background:rgba(0,0,0,.55);
  color:#fff;
  cursor:pointer;
  font-size:27px;
}
.gallery-prev{left:15px}
.gallery-next{right:15px}
.thumb-strip{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:10px 12px 13px;
  background:#0b0806;
  border-top:1px solid rgba(201,164,92,.12);
}
.thumb{
  flex:0 0 auto;
  width:76px;height:54px;
  overflow:hidden;
  border:1px solid rgba(201,164,92,.16);
  opacity:.55;
  background:#120d09;
  cursor:pointer;
}
.thumb.active{opacity:1;border-color:var(--gold)}
.thumb img{width:100%;height:100%;object-fit:cover}

@media(max-width:1050px){
  .container{width:min(var(--max),calc(100% - 50px))}
  .detail-layout{grid-template-columns:1fr}
  .info-panel{position:relative;top:auto}
}
@media(max-width:700px){
  .container{width:calc(100% - 32px)}
  .detail-hero{
    min-height:560px;
    padding:125px 0 55px;
    align-items:flex-end;
  }
  .detail-hero::before{
    left:-120px;
    width:680px;
  }
  .detail-hero::after{font-size:80px}
  .detail-title{font-size:clamp(40px,12vw,58px)}
  .detail-title span{font-size:11px;letter-spacing:2.5px}
  .detail-summary{font-size:13px}
  .detail-main{padding-top:40px}
  .info-panel{padding:23px}
  .gallery-heading{display:block}
  .gallery-count{display:block;margin-top:7px}
  .gallery-grid{grid-template-columns:1fr;gap:10px}
  .bottom-cta{padding:30px 22px}
  .bottom-cta h2{font-size:27px}
  .action-btn{width:100%}
  .modal{padding:7px}
  .modal-box{max-height:96vh}
  .modal-stage{min-height:55vh}
  .gallery-nav{width:40px;height:40px;font-size:22px}
  .gallery-prev{left:7px}
  .gallery-next{right:7px}
}
</style>
</head>

<body>

<main>

<script src="assets/customer-master-nav.js"></script>

<script>
"use strict";

/*
  CHATPHETCH GROUP — PROJECT DETAIL

  หน้า Detail นี้ไม่สร้างข้อมูล Case Study ปลอม
  แต่ใช้ข้อมูลที่มีอยู่จริงใน assets/Projects:
  - ชื่อหมวด
  - จำนวนรูป
  - รูปภาพทั้งหมดของหมวด
  - เส้นทางไฟล์รูป

  เรียกด้วย:
    project-detail.html?category=Epoxy%20self

  รองรับ alias เดิม:
    flooring
    stamped
    coating
    construction
*/

const TREE_API =
  "https://api.github.com/repos/chatphetch/chatpetch-group/git/trees/main?recursive=1";

const RAW_BASE =
  "https://raw.githubusercontent.com/chatphetch/chatpetch-group/main/";

const CACHE_KEY = "chatpetch_projects_tree_v3";
const CACHE_TIME_KEY = "chatpetch_projects_tree_v3_time";
const CACHE_MAX_AGE = 30 * 60 * 1000;

const CATEGORY_ORDER = [
  "Epoxy anti static",
  "Epoxy self",
  "PU Coating",
  "PU Self",
  "งาน Polishing",
  "งาน Stamped Concrete",
  "งานกันซึม Fiberglass"
];

const CATEGORY_META = {
  "Epoxy anti static":{
    title:"Epoxy Anti Static",
    subtitle:"ANTI-STATIC FLOORING",
    description:
      "ผลงานระบบพื้น Epoxy Anti Static จากโฟลเดอร์ผลงานของ CHATPHETCH GROUP"
  },
  "Epoxy self":{
    title:"Epoxy Self",
    subtitle:"SELF-LEVELLING / EPOXY FLOOR",
    description:
      "ผลงานระบบพื้น Epoxy Self จากโฟลเดอร์ผลงานของ CHATPHETCH GROUP"
  },
  "PU Coating":{
    title:"PU Coating",
    subtitle:"POLYURETHANE COATING",
    description:
      "ผลงานระบบ PU Coating จากโฟลเดอร์ผลงานของ CHATPHETCH GROUP"
  },
  "PU Self":{
    title:"PU Self",
    subtitle:"POLYURETHANE SELF-LEVELLING",
    description:
      "ผลงานระบบ PU Self จากโฟลเดอร์ผลงานของ CHATPHETCH GROUP"
  },
  "งาน Polishing":{
    title:"งาน Polishing",
    subtitle:"POLISHED CONCRETE",
    description:
      "ผลงานงาน Polishing จากโฟลเดอร์ผลงานของ CHATPHETCH GROUP"
  },
  "งาน Stamped Concrete":{
    title:"งาน Stamped Concrete",
    subtitle:"DECORATIVE CONCRETE",
    description:
      "ผลงานงาน Stamped Concrete จากโฟลเดอร์ผลงานของ CHATPHETCH GROUP"
  },
  "งานกันซึม Fiberglass":{
    title:"งานกันซึม Fiberglass",
    subtitle:"FIBERGLASS WATERPROOFING",
    description:
      "ผลงานงานกันซึม Fiberglass จากโฟลเดอร์ผลงานของ CHATPHETCH GROUP"
  }
};

const CATEGORY_ALIASES = {
  flooring:"Epoxy anti static",
  stamped:"งาน Stamped Concrete",
  coating:"PU Coating",
  construction:"งาน Polishing"
};

let currentProject = null;
let currentGallery = [];
let currentGalleryIndex = 0;

const $ = selector => document.querySelector(selector);

function escapeHtml(value){
  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function isImage(path){
  return /\.(jpe?g|png|webp|gif)$/i.test(path || "");
}

function encodeCategory(category){
  return encodeURIComponent(category);
}

function decodeCategoryParam(){
  const params = new URLSearchParams(window.location.search);
  const raw = params.get("category");

  if(!raw) return "";

  const decoded = decodeURIComponent(raw);
  return CATEGORY_ALIASES[decoded] || decoded;
}

function getProjectFromTree(tree,category){
  if(!category) return null;

  const prefix = "assets/Projects/" + category + "/";

  const images = tree
    .filter(item =>
      item.type === "blob" &&
      item.path.startsWith(prefix) &&
      isImage(item.path)
    )
    .sort((a,b) =>
      a.path.localeCompare(
        b.path,
        undefined,
        {numeric:true,sensitivity:"base"}
      )
    )
    .map(item => ({
      path:item.path,
      url:RAW_BASE +
        item.path
          .split("/")
          .map(encodeURIComponent)
          .join("/")
    }));

  if(!images.length) return null;

  const meta = CATEGORY_META[category] || {
    title:category,
    subtitle:"PROJECT",
    description:"ผลงานจากโฟลเดอร์ Projects"
  };

  return {
    key:category,
    title:meta.title,
    subtitle:meta.subtitle,
    description:meta.description,
    images
  };
}

async function fetchTree(){
  const cached = sessionStorage.getItem(CACHE_KEY);
  const cachedTime = Number(
    sessionStorage.getItem(CACHE_TIME_KEY) || 0
  );

  if(
    cached &&
    Date.now() - cachedTime < CACHE_MAX_AGE
  ){
    try{
      return JSON.parse(cached);
    }catch(error){}
  }

  const response = await fetch(TREE_API,{
    headers:{
      "Accept":"application/vnd.github+json"
    },
    cache:"no-store"
  });

  if(!response.ok){
    throw new Error("GitHub Tree API " + response.status);
  }

  const data = await response.json();

  if(data.truncated === true){
    throw new Error("GitHub repository tree is truncated");
  }

  const tree = data.tree || [];

  sessionStorage.setItem(CACHE_KEY,JSON.stringify(tree));
  sessionStorage.setItem(CACHE_TIME_KEY,String(Date.now()));

  return tree;
}

function renderProject(project){
  currentProject = project;
  currentGallery = project.images;
  currentGalleryIndex = 0;

  document.title =
    project.title + " | CHATPHETCH GROUP";

  $("#detailTitle").innerHTML = `
    ${escapeHtml(project.title)}
    <span>${escapeHtml(project.subtitle)}</span>
  `;

  $("#detailSummary").textContent =
    project.description;

  $("#backCategory").href =
    "projects.html?category=" +
    encodeCategory(project.key);

  $("#detailContent").innerHTML = `
    <div class="detail-layout">

      <aside class="info-panel">

        <div class="info-kicker">PROJECT CATEGORY</div>

        <h2 class="info-title">
          ${escapeHtml(project.title)}
        </h2>

        <div class="info-subtitle">
          ${escapeHtml(project.subtitle)}
        </div>

        <div class="info-line"></div>

        <p class="info-text">
          หน้านี้แสดงข้อมูลจากหมวดผลงานที่มีอยู่จริงใน
          <b>assets/Projects</b>
          ของ Repository โดยไม่สมมติข้อมูลโครงการที่ยังไม่มีการบันทึกไว้
        </p>

        <div class="info-list">

          <div class="info-item">
            <small>ประเภทผลงาน</small>
            <strong>${escapeHtml(project.title)}</strong>
          </div>

          <div class="info-item">
            <small>ระบบงาน</small>
            <strong>${escapeHtml(project.subtitle)}</strong>
          </div>

          <div class="info-item">
            <small>จำนวนภาพ</small>
            <strong>${project.images.length} รูป</strong>
          </div>

          <div class="info-item">
            <small>แหล่งข้อมูล</small>
            <strong>assets/Projects/${escapeHtml(project.key)}/</strong>
          </div>

        </div>

      </aside>

      <section class="gallery-panel">

        <div class="gallery-heading">
          <div>
            <div class="gallery-kicker">PROJECT GALLERY</div>
            <h2 class="gallery-title">
              ภาพผลงาน
            </h2>
          </div>

          <div class="gallery-count">
            ${project.images.length} รูป
          </div>
        </div>

        <div class="gallery-grid">
          ${project.images.map((image,index) => `
            <button
              type="button"
              class="gallery-card"
              data-index="${index}"
              aria-label="เปิดภาพ ${index + 1}"
            >
              <span class="gallery-number">
                ${String(index + 1).padStart(2,"0")}
              </span>

              <img
                src="${escapeHtml(image.url)}"
                alt="${escapeHtml(project.title)} ภาพที่ ${index + 1}"
                loading="${index < 4 ? "eager" : "lazy"}"
                referrerpolicy="no-referrer"
              >
            </button>
          `).join("")}
        </div>

      </section>

    </div>

    <section class="bottom-cta">
      <h2>ต้องการสอบถามงานประเภทนี้?</h2>
      <p>
        หากต้องการข้อมูลเพิ่มเติมเกี่ยวกับระบบงาน วัสดุ
        หรือแนวทางการทำงาน สามารถติดต่อทีม CHATPHETCH GROUP ได้
      </p>

      <a class="action-btn primary" href="contact.html">
        ติดต่อเรา
      </a>

      <a
        class="action-btn"
        href="projects.html"
      >
        ← กลับผลงานทั้งหมด
      </a>
    </section>
  `;

  document.querySelectorAll(".gallery-card").forEach(card => {
    card.addEventListener("click",() => {
      openGallery(Number(card.dataset.index));
    });
  });
}

function renderError(message){
  $("#detailContent").innerHTML = `
    <div class="error-box">
      <strong>ไม่สามารถโหลดรายละเอียดผลงานได้</strong>
      ${escapeHtml(message)}
      <br><br>
      กรุณากลับไปหน้า Projects แล้วเลือกหมวดผลงานอีกครั้ง
    </div>
  `;
}

function openGallery(index){
  if(!currentGallery.length) return;

  currentGalleryIndex = index;
  $("#modalTitle").textContent = currentProject?.title || "PROJECT";

  renderThumbs();
  showGalleryImage();

  $("#galleryModal").classList.add("open");
  $("#galleryModal").setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";
}

function closeGallery(){
  $("#galleryModal").classList.remove("open");
  $("#galleryModal").setAttribute("aria-hidden","true");
  document.body.style.overflow = "";
}

function showGalleryImage(){
  if(!currentGallery.length) return;

  const image = currentGallery[currentGalleryIndex];

  $("#modalImage").src = image.url;
  $("#modalImage").alt =
    image.path.split("/").pop();

  $("#modalCounter").textContent =
    `${currentGalleryIndex + 1} / ${currentGallery.length}`;

  document.querySelectorAll(".thumb").forEach((thumb,index) => {
    thumb.classList.toggle(
      "active",
      index === currentGalleryIndex
    );
  });
}

function renderThumbs(){
  $("#thumbStrip").innerHTML =
    currentGallery.map((image,index) => `
      <button
        type="button"
        class="thumb ${index === currentGalleryIndex ? "active" : ""}"
        data-index="${index}"
        aria-label="ดูภาพ ${index + 1}"
      >
        <img
          src="${escapeHtml(image.url)}"
          alt=""
          loading="lazy"
          referrerpolicy="no-referrer"
        >
      </button>
    `).join("");

  $("#thumbStrip")
    .querySelectorAll(".thumb")
    .forEach(thumb => {
      thumb.addEventListener("click",() => {
        currentGalleryIndex =
          Number(thumb.dataset.index);

        showGalleryImage();
      });
    });
}

function nextImage(){
  if(!currentGallery.length) return;

  currentGalleryIndex =
    (currentGalleryIndex + 1) %
    currentGallery.length;

  showGalleryImage();
}

function prevImage(){
  if(!currentGallery.length) return;

  currentGalleryIndex =
    (currentGalleryIndex - 1 + currentGallery.length) %
    currentGallery.length;

  showGalleryImage();
}

$("#modalClose").addEventListener("click",closeGallery);
$("#galleryNext").addEventListener("click",nextImage);
$("#galleryPrev").addEventListener("click",prevImage);

$("#galleryModal").addEventListener("click",event => {
  if(event.target === $("#galleryModal")){
    closeGallery();
  }
});

document.addEventListener("keydown",event => {
  if(!$("#galleryModal").classList.contains("open")){
    return;
  }

  if(event.key === "Escape") closeGallery();
  if(event.key === "ArrowRight") nextImage();
  if(event.key === "ArrowLeft") prevImage();
});

async function initDetail(){
  const category = decodeCategoryParam();

  if(!category){
    renderError(
      "ไม่พบหมวดผลงานใน URL"
    );
    return;
  }

  try{
    const tree = await fetchTree();

    const project =
      getProjectFromTree(tree,category);

    if(!project){
      renderError(
        "ไม่พบรูปผลงานของหมวด " + category
      );
      return;
    }

    renderProject(project);

  }catch(error){
    console.error(
      "CHATPHETCH PROJECT DETAIL:",
      error
    );

    renderError(
      "การเชื่อมต่อข้อมูลจาก Repository ไม่สำเร็จในขณะนี้"
    );
  }
}

initDetail();
</script>
