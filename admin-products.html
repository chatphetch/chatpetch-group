<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>จัดการสินค้า | CHATPHETCH GROUP</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #f5f6f8;
      color: #1f2937;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .topbar {
      height: 70px;
      background: #111827;
      color: white;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 28px;
    }

    .brand {
      font-size: 20px;
      font-weight: 800;
    }

    .brand small {
      display: block;
      font-size: 11px;
      font-weight: 400;
      opacity: .65;
      margin-top: 2px;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-success {
      background: #16a34a;
      color: white;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
      margin-bottom: 24px;
    }

    .page-header h1 {
      margin: 0;
      font-size: 28px;
    }

    .page-header p {
      margin: 6px 0 0;
      color: #6b7280;
    }

    .toolbar {
      background: white;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 20px;

      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toolbar input,
    .toolbar select {
      padding: 11px 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      min-width: 220px;
      outline: none;
    }

    .toolbar input:focus,
    .toolbar select:focus {
      border-color: #2563eb;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .product-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #e5e7eb;

      display: flex;
      flex-direction: column;
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .no-image {
      color: #9ca3af;
      font-size: 14px;
    }

    .product-body {
      padding: 16px;
    }

    .product-category {
      display: inline-block;
      background: #eff6ff;
      color: #1d4ed8;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    .product-name {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .product-code {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
    }

    .status-active {
      background: #dcfce7;
      color: #166534;
    }

    .status-hidden {
      background: #fee2e2;
      color: #991b1b;
    }

    .product-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 15px;
    }

    .product-actions button {
      border: 0;
      border-radius: 9px;
      padding: 9px;
      cursor: pointer;
      font-weight: 700;
    }

    .edit-btn {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .delete-btn {
      background: #fef2f2;
      color: #b91c1c;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;
      z-index: 1000;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      background: white;
      width: min(1000px, 100%);
      max-height: 94vh;
      overflow-y: auto;

      border-radius: 18px;
      padding: 26px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .modal-header h2 {
      margin: 0;
    }

    .close-btn {
      border: 0;
      background: #f3f4f6;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 800;
      color: #374151;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      outline: none;
    }

    .form-group textarea {
      min-height: 110px;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #2563eb;
    }

    .helper {
      color: #6b7280;
      font-size: 12px;
    }

    .upload-box {
      border: 2px dashed #d1d5db;
      border-radius: 12px;
      padding: 16px;
      background: #fafafa;
    }

    .preview-image {
      margin-top: 12px;
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      display: none;
    }

    .pdf-link {
      display: none;
      margin-top: 10px;
      font-size: 13px;
      color: #2563eb;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding-top: 10px;
    }

    .check-row input {
      width: 18px;
      height: 18px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #e5e7eb;
    }

    .empty {
      background: white;
      padding: 60px 20px;
      border-radius: 16px;
      text-align: center;
      color: #6b7280;
      grid-column: 1 / -1;
    }

    .loading {
      text-align: center;
      padding: 50px;
      color: #6b7280;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 2000;

      background: #111827;
      color: white;

      padding: 13px 18px;
      border-radius: 10px;

      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }

    .toast.show {
      display: block;
    }

    .toast.error {
      background: #b91c1c;
    }

    @media (max-width: 1100px) {
      .products-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 800px) {
      .products-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .page-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 560px) {
      .container {
        padding: 16px;
      }

      .topbar {
        padding: 0 16px;
      }

      .products-grid {
        grid-template-columns: 1fr;
      }

      .toolbar input,
      .toolbar select {
        width: 100%;
        min-width: 0;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="brand">
      CHATPHETCH GROUP
      <small>ระบบจัดการสินค้า</small>
    </div>

    <div class="top-actions">
      <button
        class="btn btn-secondary"
        onclick="goToWebsite()"
      >
        ดูเว็บไซต์
      </button>

      <button
        class="btn btn-danger"
        onclick="logout()"
      >
        ออกจากระบบ
      </button>
    </div>
  </header>


  <main class="container">

    <div class="page-header">
      <div>
        <h1>จัดการสินค้า</h1>
        <p>
          เพิ่ม แก้ไข ลบ และจัดการข้อมูลสินค้าบนเว็บไซต์
        </p>
      </div>

      <button
        class="btn btn-primary"
        onclick="openAddProduct()"
      >
        + เพิ่มสินค้า
      </button>
    </div>


    <div class="toolbar">

      <input
        type="search"
        id="searchInput"
        placeholder="ค้นหาชื่อสินค้า / รหัสสินค้า..."
        oninput="renderProducts()"
      >

      <select
        id="categoryFilter"
        onchange="renderProducts()"
      >
        <option value="">ทุกหมวดหมู่</option>
        <option value="floor">พื้น / พิมพ์ลายคอนกรีต</option>
        <option value="coating">วัสดุเคลือบ / เคลือบผิว</option>
        <option value="paint">สี</option>
        <option value="construction">วัสดุก่อสร้าง</option>
        <option value="other">อื่น ๆ</option>
      </select>

      <select
        id="statusFilter"
        onchange="renderProducts()"
      >
        <option value="">ทุกสถานะ</option>
        <option value="active">แสดงบนเว็บไซต์</option>
        <option value="hidden">ซ่อนจากเว็บไซต์</option>
      </select>

    </div>


    <div
      id="productsGrid"
      class="products-grid"
    >
      <div class="loading">
        กำลังโหลดข้อมูลสินค้า...
      </div>
    </div>

  </main>


  <!-- =====================================================
       MODAL
  ====================================================== -->

  <div
    id="productModal"
    class="modal"
  >

    <div class="modal-box">

      <div class="modal-header">
        <h2 id="modalTitle">
          เพิ่มสินค้า
        </h2>

        <button
          class="close-btn"
          onclick="closeModal()"
        >
          ×
        </button>
      </div>


      <form id="productForm">

        <input
          type="hidden"
          id="productId"
        >

        <div class="form-grid">


          <!-- ชื่อสินค้า -->

          <div class="form-group full">
            <label>
              ชื่อสินค้า *
            </label>

            <input
              type="text"
              id="name"
              required
              placeholder="เช่น สีพิมพ์ลายคอนกรีต รุ่น M 1-26"
            >
          </div>


          <!-- รหัส -->

          <div class="form-group">
            <label>
              รหัสสินค้า
            </label>

            <input
              type="text"
              id="code"
              placeholder="เช่น 91428"
            >
          </div>


          <!-- หมวดหมู่ -->

          <div class="form-group">
            <label>
              หมวดหมู่ *
            </label>

            <select id="category" required>

              <option value="floor">
                พื้น / พิมพ์ลายคอนกรีต
              </option>

              <option value="coating">
                วัสดุเคลือบ / เคลือบผิว
              </option>

              <option value="paint">
                สี
              </option>

              <option value="construction">
                วัสดุก่อสร้าง
              </option>

              <option value="other">
                อื่น ๆ
              </option>

            </select>
          </div>


          <!-- ราคา -->

          <div class="form-group">
            <label>
              ราคา
            </label>

            <input
              type="number"
              id="price"
              min="0"
              step="0.01"
              placeholder="เช่น 850"
            >
          </div>


          <!-- สถานะ -->

          <div class="form-group">
            <label>
              สถานะเว็บไซต์
            </label>

            <div class="check-row">

              <input
                type="checkbox"
                id="isActive"
                checked
              >

              <label for="isActive">
                แสดงสินค้านี้บนเว็บไซต์
              </label>

            </div>
          </div>


          <!-- รายละเอียด -->

          <div class="form-group full">

            <label>
              รายละเอียดสินค้า
            </label>

            <textarea
              id="description"
              placeholder="รายละเอียดสินค้า..."
            ></textarea>

          </div>


          <!-- จุดเด่น -->

          <div class="form-group full">

            <label>
              จุดเด่นผลิตภัณฑ์
            </label>

            <textarea
              id="highlights"
              placeholder="กรอกทีละบรรทัด เช่น&#10;สีคงทน ไม่ซีดจาง&#10;มีหลากหลายสีสัน&#10;ทนต่อทุกสภาพอากาศ"
            ></textarea>

            <div class="helper">
              1 บรรทัด = 1 จุดเด่น
            </div>

          </div>


          <!-- เกรด -->

          <div class="form-group">

            <label>
              เกรด
            </label>

            <input
              type="text"
              id="technicalGrade"
              placeholder="เช่น M 1 - 26"
            >

          </div>


          <!-- ปริมาณ -->

          <div class="form-group">

            <label>
              ปริมาณ
            </label>

            <input
              type="text"
              id="technicalQuantity"
              placeholder="เช่น 1 กระสอบ = 25 กก."
            >

          </div>


          <!-- พื้นที่ -->

          <div class="form-group">

            <label>
              พื้นที่ใช้งาน
            </label>

            <input
              type="text"
              id="technicalCoverage"
              placeholder="เช่น 8-10 ตร.ม./กระสอบ"
            >

          </div>


          <!-- ขนาด -->

          <div class="form-group">

            <label>
              ขนาดบรรจุ
            </label>

            <input
              type="text"
              id="packageSize"
              placeholder="เช่น 25 กก."
            >

          </div>


          <!-- การใช้งาน -->

          <div class="form-group full">

            <label>
              การใช้งาน
            </label>

            <textarea
              id="usage"
              placeholder="เช่น สำหรับงานพิมพ์ลายคอนกรีต"
            ></textarea>

          </div>


          <!-- สรุป -->

          <div class="form-group full">

            <label>
              ขนาดบรรจุ / พื้นที่ใช้งาน
            </label>

            <input
              type="text"
              id="packageSummary"
              placeholder="เช่น 8-10 ตร.ม./กระสอบ | ขนาดบรรจุ 25 กก."
            >

          </div>


          <!-- รูป -->

          <div class="form-group full">

            <label>
              รูปสินค้า
            </label>

            <div class="upload-box">

              <input
                type="file"
                id="imageFile"
                accept="image/*"
                onchange="previewImage()"
              >

              <div class="helper">
                JPG / PNG / WEBP
              </div>

              <img
                id="imagePreview"
                class="preview-image"
                alt="preview"
              >

            </div>

          </div>


          <!-- PDF -->

          <div class="form-group full">

            <label>
              PDF เอกสารสินค้า
            </label>

            <div class="upload-box">

              <input
                type="file"
                id="pdfFile"
                accept="application/pdf"
              >

              <div class="helper">
                ใช้สำหรับไฟล์ข้อมูลสินค้า / Specification
              </div>

              <a
                id="pdfLink"
                class="pdf-link"
                target="_blank"
              >
                เปิด PDF ปัจจุบัน
              </a>

            </div>

          </div>


        </div>


        <div class="modal-footer">

          <button
            type="button"
            class="btn btn-secondary"
            onclick="closeModal()"
          >
            ยกเลิก
          </button>

          <button
            type="submit"
            class="btn btn-primary"
            id="saveButton"
          >
            บันทึกสินค้า
          </button>

        </div>

      </form>

    </div>

  </div>


  <div
    id="toast"
    class="toast"
  ></div>


<script>

  /* =====================================================
     SUPABASE
  ====================================================== */

  const SUPABASE_URL =
    "https://mfhllgklcfnnbyyzzljz.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_rkWSZF3He7_mhCIRY9MaNQ_JGBEa1l5";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =====================================================
     STATE
  ====================================================== */

  let products = [];

  let editingProduct = null;


  /* =====================================================
     CATEGORY LABEL
  ====================================================== */

  const CATEGORY_LABELS = {

    floor:
      "พื้น / พิมพ์ลายคอนกรีต",

    coating:
      "วัสดุเคลือบ / เคลือบผิว",

    paint:
      "สี",

    construction:
      "วัสดุก่อสร้าง",

    other:
      "อื่น ๆ"

  };


  function categoryLabel(category) {

    return CATEGORY_LABELS[category]
      || category
      || "อื่น ๆ";

  }


  /* =====================================================
     INIT
  ====================================================== */

  document.addEventListener(
    "DOMContentLoaded",
    async () => {

      const {
        data: {
          session
        }
      } =
        await supabaseClient.auth.getSession();

      if (!session) {

        window.location.href =
          "admin.html";

        return;

      }

      await loadProducts();

    }
  );


  /* =====================================================
     LOAD PRODUCTS
  ====================================================== */

  async function loadProducts() {

    const grid =
      document.getElementById(
        "productsGrid"
      );

    grid.innerHTML = `
      <div class="loading">
        กำลังโหลดข้อมูลสินค้า...
      </div>
    `;


    const {
      data,
      error
    } =
      await supabaseClient
        .from("products")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(error);

      grid.innerHTML = `
        <div class="empty">
          ไม่สามารถโหลดข้อมูลสินค้าได้
          <br>
          <small>
            ${escapeHtml(error.message)}
          </small>
        </div>
      `;

      return;

    }


    products = data || [];

    renderProducts();

  }


  /* =====================================================
     RENDER
  ====================================================== */

  function renderProducts() {

    const grid =
      document.getElementById(
        "productsGrid"
      );

    const search =
      document.getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


    const category =
      document.getElementById(
        "categoryFilter"
      )
      .value;


    const status =
      document.getElementById(
        "statusFilter"
      )
      .value;


    const filtered =
      products.filter(product => {

        const matchSearch =
          !search
          ||
          (product.name || "")
            .toLowerCase()
            .includes(search)
          ||
          (product.code || "")
            .toLowerCase()
            .includes(search);


        const matchCategory =
          !category
          ||
          product.category === category;


        const matchStatus =
          !status
          ||
          (
            status === "active"
            &&
            product.is_active === true
          )
          ||
          (
            status === "hidden"
            &&
            product.is_active === false
          );


        return (
          matchSearch
          &&
          matchCategory
          &&
          matchStatus
        );

      });


    if (!filtered.length) {

      grid.innerHTML = `
        <div class="empty">
          ไม่พบสินค้า
        </div>
      `;

      return;

    }


    grid.innerHTML =
      filtered
        .map(productCard)
        .join("");

  }


  /* =====================================================
     PRODUCT CARD
  ====================================================== */

  function productCard(product) {

    const image =
      product.image_url
        ? `
          <img
            src="${escapeAttr(product.image_url)}"
            alt="${escapeAttr(product.name)}"
          >
        `
        : `
          <div class="no-image">
            ไม่มีรูปสินค้า
          </div>
        `;


    const statusClass =
      product.is_active
        ? "status-active"
        : "status-hidden";


    const statusText =
      product.is_active
        ? "แสดงบนเว็บไซต์"
        : "ซ่อน";


    return `

      <article class="product-card">

        <div class="product-image">
          ${image}
        </div>

        <div class="product-body">

          <div class="product-category">
            ${escapeHtml(
              categoryLabel(
                product.category
              )
            )}
          </div>

          <div class="product-name">
            ${escapeHtml(
              product.name
            )}
          </div>

          <div class="product-code">
            รหัส:
            ${escapeHtml(
              product.code || "-"
            )}
          </div>

          <span
            class="status ${statusClass}"
          >
            ${statusText}
          </span>

          <div class="product-actions">

            <button
              class="edit-btn"
              onclick="editProduct('${product.id}')"
            >
              แก้ไข
            </button>

            <button
              class="delete-btn"
              onclick="deleteProduct('${product.id}')"
            >
              ลบ
            </button>

          </div>

        </div>

      </article>

    `;

  }


  /* =====================================================
     OPEN ADD
  ====================================================== */

  function openAddProduct() {

    editingProduct = null;

    document.getElementById(
      "modalTitle"
    ).textContent =
      "เพิ่มสินค้า";


    document.getElementById(
      "productForm"
    ).reset();


    document.getElementById(
      "productId"
    ).value = "";


    document.getElementById(
      "isActive"
    ).checked = true;


    document.getElementById(
      "imagePreview"
    ).style.display =
      "none";


    document.getElementById(
      "pdfLink"
    ).style.display =
      "none";


    document.getElementById(
      "productModal"
    ).classList.add("show");

  }


  /* =====================================================
     EDIT
  ====================================================== */

  function editProduct(id) {

    const product =
      products.find(
        item => item.id === id
      );


    if (!product) {

      showToast(
        "ไม่พบข้อมูลสินค้า",
        true
      );

      return;

    }


    editingProduct = product;


    document.getElementById(
      "modalTitle"
    ).textContent =
      "แก้ไขสินค้า";


    document.getElementById(
      "productId"
    ).value =
      product.id || "";


    document.getElementById(
      "name"
    ).value =
      product.name || "";


    document.getElementById(
      "code"
    ).value =
      product.code || "";


    document.getElementById(
      "category"
    ).value =
      product.category || "other";


    document.getElementById(
      "price"
    ).value =
      product.price ?? "";


    document.getElementById(
      "description"
    ).value =
      product.description || "";


    document.getElementById(
      "highlights"
    ).value =
      Array.isArray(product.highlights)
        ? product.highlights.join("\n")
        : "";


    document.getElementById(
      "technicalGrade"
    ).value =
      product.technical_grade || "";


    document.getElementById(
      "technicalQuantity"
    ).value =
      product.technical_quantity || "";


    document.getElementById(
      "technicalCoverage"
    ).value =
      product.technical_coverage || "";


    document.getElementById(
      "packageSize"
    ).value =
      product.package_size || "";


    document.getElementById(
      "usage"
    ).value =
      product.usage || "";


    document.getElementById(
      "packageSummary"
    ).value =
      product.package_summary || "";


    document.getElementById(
      "isActive"
    ).checked =
      product.is_active !== false;


    const preview =
      document.getElementById(
        "imagePreview"
      );


    if (product.image_url) {

      preview.src =
        product.image_url;

      preview.style.display =
        "block";

    } else {

      preview.style.display =
        "none";

    }


    const pdfLink =
      document.getElementById(
        "pdfLink"
      );


    if (product.spec_pdf_url) {

      pdfLink.href =
        product.spec_pdf_url;

      pdfLink.style.display =
        "inline-block";

    } else {

      pdfLink.style.display =
        "none";

    }


    document.getElementById(
      "productModal"
    ).classList.add("show");

  }


  /* =====================================================
     CLOSE
  ====================================================== */

  function closeModal() {

    document.getElementById(
      "productModal"
    ).classList.remove("show");

  }


  /* =====================================================
     IMAGE PREVIEW
  ====================================================== */

  function previewImage() {

    const file =
      document.getElementById(
        "imageFile"
      ).files[0];


    if (!file) {

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      event => {

        const preview =
          document.getElementById(
            "imagePreview"
          );


        preview.src =
          event.target.result;


        preview.style.display =
          "block";

      };


    reader.readAsDataURL(file);

  }


  /* =====================================================
     SAVE
  ====================================================== */

  document.getElementById(
    "productForm"
  ).addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      const saveButton =
        document.getElementById(
          "saveButton"
        );


      saveButton.disabled =
        true;

      saveButton.textContent =
        "กำลังบันทึก...";


      try {

        const productId =
          document.getElementById(
            "productId"
          ).value;


        const name =
          document.getElementById(
            "name"
          ).value.trim();


        const code =
          document.getElementById(
            "code"
          ).value.trim();


        const category =
          document.getElementById(
            "category"
          ).value;


        const priceValue =
          document.getElementById(
            "price"
          ).value;


        const description =
          document.getElementById(
            "description"
          ).value.trim();


        const highlightsText =
          document.getElementById(
            "highlights"
          ).value;


        const highlights =
          highlightsText
            .split("\n")
            .map(item => item.trim())
            .filter(Boolean);


        const technicalGrade =
          document.getElementById(
            "technicalGrade"
          ).value.trim();


        const technicalQuantity =
          document.getElementById(
            "technicalQuantity"
          ).value.trim();


        const technicalCoverage =
          document.getElementById(
            "technicalCoverage"
          ).value.trim();


        const packageSize =
          document.getElementById(
            "packageSize"
          ).value.trim();


        const usage =
          document.getElementById(
            "usage"
          ).value.trim();


        const packageSummary =
          document.getElementById(
            "packageSummary"
          ).value.trim();


        const isActive =
          document.getElementById(
            "isActive"
          ).checked;


        const imageFile =
          document.getElementById(
            "imageFile"
          ).files[0];


        const pdfFile =
          document.getElementById(
            "pdfFile"
          ).files[0];


        let imageUrl =
          editingProduct?.image_url
          || null;


        let pdfUrl =
          editingProduct?.spec_pdf_url
          || null;


        /*
         * รูปสินค้า
         */

        if (imageFile) {

          const {
            data: {
              user
            }
          } =
            await supabaseClient.auth.getUser();


          if (!user) {

            throw new Error(
              "เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่"
            );

          }


          const extension =
            getFileExtension(
              imageFile.name
            );


          const filePath =
            `${user.id}/${crypto.randomUUID()}.${extension}`;


          const {
            error: uploadError
          } =
            await supabaseClient
              .storage
              .from("product-images")
              .upload(
                filePath,
                imageFile,
                {
                  upsert: false
                }
              );


          if (uploadError) {

            throw uploadError;

          }


          const {
            data: publicData
          } =
            supabaseClient
              .storage
              .from("product-images")
              .getPublicUrl(
                filePath
              );


          imageUrl =
            publicData.publicUrl;

        }


        /*
         * PDF
         */

        if (pdfFile) {

          const {
            data: {
              user
            }
          } =
            await supabaseClient.auth.getUser();


          if (!user) {

            throw new Error(
              "เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่"
            );

          }


          const filePath =
            `${user.id}/${crypto.randomUUID()}.pdf`;


          const {
            error: uploadError
          } =
            await supabaseClient
              .storage
              .from("product-pdfs")
              .upload(
                filePath,
                pdfFile,
                {
                  upsert: false,
                  contentType:
                    "application/pdf"
                }
              );


          if (uploadError) {

            throw uploadError;

          }


          const {
            data: publicData
          } =
            supabaseClient
              .storage
              .from("product-pdfs")
              .getPublicUrl(
                filePath
              );


          pdfUrl =
            publicData.publicUrl;

        }


        const payload = {

          name,

          code:
            code || null,

          category,

          price:
            priceValue
              ? Number(priceValue)
              : null,

          image_url:
            imageUrl,

          spec_pdf_url:
            pdfUrl,

          description:
            description || null,

          highlights,

          technical_grade:
            technicalGrade || null,

          technical_quantity:
            technicalQuantity || null,

          technical_coverage:
            technicalCoverage || null,

          package_size:
            packageSize || null,

          usage:
            usage || null,

          package_summary:
            packageSummary || null,

          is_active:
            isActive

        };


        let error;


        /*
         * เพิ่ม
         */

        if (!productId) {

          ({
            error
          } =
            await supabaseClient
              .from("products")
              .insert(payload));

        }

        /*
         * แก้ไข
         */

        else {

          ({
            error
          } =
            await supabaseClient
              .from("products")
              .update(payload)
              .eq(
                "id",
                productId
              ));

        }


        if (error) {

          throw error;

        }


        showToast(
          productId
            ? "แก้ไขสินค้าเรียบร้อยแล้ว"
            : "เพิ่มสินค้าเรียบร้อยแล้ว"
        );


        closeModal();

        await loadProducts();

      } catch (error) {

        console.error(error);

        showToast(
          error.message
            || "เกิดข้อผิดพลาด",
          true
        );

      } finally {

        saveButton.disabled =
          false;

        saveButton.textContent =
          "บันทึกสินค้า";

      }

    }
  );


  /* =====================================================
     DELETE
  ====================================================== */

  async function deleteProduct(id) {

    const product =
      products.find(
        item => item.id === id
      );


    if (!product) {

      return;

    }


    const confirmed =
      confirm(
        `ต้องการลบสินค้า "${product.name}" หรือไม่?`
      );


    if (!confirmed) {

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from("products")
        .delete()
        .eq(
          "id",
          id
        );


    if (error) {

      console.error(error);

      showToast(
        error.message,
        true
      );

      return;

    }


    showToast(
      "ลบสินค้าเรียบร้อยแล้ว"
    );


    await loadProducts();

  }


  /* =====================================================
     LOGOUT
  ====================================================== */

  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
      "admin.html";

  }


  /* =====================================================
     WEBSITE
  ====================================================== */

  function goToWebsite() {

    window.location.href =
      "products.html";

  }


  /* =====================================================
     TOAST
  ====================================================== */

  function showToast(
    message,
    error = false
  ) {

    const toast =
      document.getElementById(
        "toast"
      );


    toast.textContent =
      message;


    toast.className =
      "toast show"
      +
      (
        error
          ? " error"
          : ""
      );


    setTimeout(
      () => {

        toast.className =
          "toast";

      },
      3000
    );

  }


  /* =====================================================
     HELPERS
  ====================================================== */

  function getFileExtension(
    filename
  ) {

    return (
      filename
        .split(".")
        .pop()
        .toLowerCase()
    );

  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function escapeAttr(value) {

    return escapeHtml(value);

  }

</script>
